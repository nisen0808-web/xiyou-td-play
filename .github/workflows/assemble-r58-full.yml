name: Assemble verified r58 full entry
on:
  push:
    branches: [codex/release-088-20261115]
    paths: ['.release-parts/**', '.github/workflows/assemble-r58-full.yml']
permissions:
  contents: write
concurrency:
  group: assemble-r58-full
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify exact full entry
        run: python3 .release-parts/assemble.py
      - name: Save verified blob on the preparation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-full.html FULL_ASSEMBLY.json
          git commit -m "Assemble and verify the exact r58 full entry"
          git push origin HEAD:refs/heads/codex/release-088-20261115
