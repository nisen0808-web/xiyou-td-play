/* 手机兜底（最先运行）：任何一步出错都不会留下空白屏——页面上会显示原因；聊天软件里的内置浏览器会提示换浏览器 */
(function () {
  var shown = 0;
  function bar(id, html, bg, ms) {
    var d = document.getElementById(id); if (d) return d;
    d = document.createElement('div'); d.id = id;
    d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:60;padding:10px 14px;border-radius:12px;border:2px solid #b9a77a;background:' + bg + ';color:#4a3a1a;font:15px/1.5 sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none;';   // 提示条本身不挡点击，只有“知道了”按钮能点
    d.innerHTML = html + ' <button style="margin-left:8px;padding:4px 12px;font:inherit;border-radius:8px;border:1px solid #b9a77a;background:#fff;color:#4a3a1a;pointer-events:auto">知道了</button>';
    d.getElementsByTagName('button')[0].onclick = function () { if (d.parentNode) d.parentNode.removeChild(d); };
    (document.body || document.documentElement).appendChild(d);
    if (ms) setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, ms);
    return d;
  }
  window.XY_bar = bar;
  window.XY_fail = function (msg) {
    if (shown++ > 2) return;
    var t = String(msg || '').replace(/[<>&]/g, ' ').slice(0, 160);
    bar('xyFail' + shown, '⚠ 游戏出了点问题：' + t + '<br>请换「Safari / Chrome」浏览器打开，或把这行字截图发给我。', '#ffe3d6');
  };
  window.addEventListener('error', function (e) { if (e && e.message) window.XY_fail(e.message + (e.lineno ? ' (行' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function () { /* 视频 / 音频被拒绝播放等：不是致命的，忽略 */ });
  var ua = navigator.userAgent || '';
  if (/MicroMessenger|MQQBrowser|QQ\/|Weibo|FBAN|FBAV|Instagram|Line\/|DingTalk|AlipayClient|TikTok|musical_ly|baiduboxapp|Telegram|GSA\/|Twitter|Grok/i.test(ua)) {
    window.addEventListener('load', function () { bar('xyInApp', '你好像是在聊天软件里打开的。如果卡住或点不动，请用右上角菜单「在浏览器中打开」（Safari / Chrome）。', '#fff4c2', 9000); });
  }
})();
</script>

    s = Math.max(0, Math.floor(s));
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  };
  // 洗牌（Fisher-Yates）
  XY.shuffle = function (a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };

  /* 带固定种子的随机（用于地图装饰，每次进游戏地图一样） */
  XY.seeded = function (seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  /* ---------- 空间网格：快速查"某个圆圈里有哪些敌人" ---------- */
  XY.Grid = function (w, h, cell) {
    this.cell = cell;
    this.cols = Math.ceil(w / cell);
    this.rows = Math.ceil(h / cell);
    this.cells = [];
    for (var i = 0; i < this.cols * this.rows; i++) this.cells.push([]);
  };
  XY.Grid.prototype.clear = function () {
    var c = this.cells;
    for (var i = 0; i < c.length; i++) c[i].length = 0;
  };
  XY.Grid.prototype.insert = function (e) {
    var cx = Math.floor(e.x / this.cell), cy = Math.floor(e.y / this.cell);
    if (cx < 0) cx = 0; else if (cx >= this.cols) cx = this.cols - 1;
    if (cy < 0) cy = 0; else if (cy >= this.rows) cy = this.rows - 1;
    this.cells[cy * this.cols + cx].push(e);
  };
  // 对圆内（含敌人半径）的每个敌人调用 fn(e, distSq)
  XY.Grid.prototype.query = function (x, y, r, fn) {
    var cell = this.cell, pad = 60; // 敌人半径最大约 50，多查一圈
    var x0 = Math.max(0, Math.floor((x - r - pad) / cell)), x1 = Math.min(this.cols - 1, Math.floor((x + r + pad) / cell));
    var y0 = Math.max(0, Math.floor((y - r - pad) / cell)), y1 = Math.min(this.rows - 1, Math.floor((y + r + pad) / cell));
    for (var cy = y0; cy <= y1; cy++) {
      for (var cx = x0; cx <= x1; cx++) {
        var list = this.cells[cy * this.cols + cx];
        for (var i = 0; i < list.length; i++) {
          var e = list[i];
          if (e.dead) continue;
          var dx = e.x - x, dy = e.y - y, rr = r + e.r;
          var d2 = dx * dx + dy * dy;
          if (d2 <= rr * rr) fn(e, d2);
        }
      }
    }
  };
  // 找最近的敌人（半径 r 内），找不到返回 null
  XY.Grid.prototype.nearest = function (x, y, r) {
    var best = null, bd = Infinity;
    this.query(x, y, r, function (e, d2) { if (d2 < bd) { bd = d2; best = e; } });
    return best;
  };
})();

  /* ================= 存档读写 ================= */

      sold: { cards: { arrow: 1, heal: 1 } },                                   // v0.5：天兵卡

  // 旧版存档升级到新版（现在只有 schema 1；以后改格式就在这里加分支）
  function migrate(d) {
    if (!d || typeof d !== 'object') return defaults();
    var base = defaults(), k;
    for (k in base) if (d[k] === undefined) d[k] = base[k];
    ['stats', 'cards', 'dex', 'unlocks', 'skins', 'party', 'levels', 'questsDone'].forEach(function (key) { if (typeof d[key] !== 'object' || !d[key]) d[key] = base[key]; });

    d.deck = d.deck.filter(function (id, i, a) { return d.cards[id] && a.indexOf(id) === i; });

    if (!d.sp || typeof d.sp !== 'object') d.sp = { cards: {}, chosen: null, shop: null, shopGen: 0 };

    if (!d.sold || typeof d.sold !== 'object' || !d.sold.cards) d.sold = base.sold;
    if (!d.tutorial || typeof d.tutorial !== 'object') d.tutorial = { done: false };
    d.schema = SCHEMA; d.gameVersion = XY.VERSION;
    return d;
  }

  var S = XY.save = {
    KEY: KEY, SCHEMA: SCHEMA, data: null, memoryOnly: false, dirty: false, _timer: null, onUnlock: null,

    load: function () {
      var raw = null;
      try { raw = window.localStorage.getItem(KEY); } catch (e) { S.memoryOnly = true; }
      var d = null;
      if (raw) { try { d = JSON.parse(raw); } catch (e2) { d = null; } }
      S.data = d ? migrate(d) : defaults();
      if (!raw) S.flush();
      return S.data;
    },
    flush: function () {
      S.dirty = false; if (S._timer) { clearTimeout(S._timer); S._timer = null; }

    },
    touch: function () { S.dirty = true; if (!S._timer) S._timer = setTimeout(function () { S._timer = null; if (S.dirty) S.flush(); }, 1500); },
    reset: function () {
      try { window.localStorage.removeItem(KEY); } catch (e) { /* 没有存储也无所谓 */ }
      var m = S.data && S.data.mode; S.data = defaults(); if (m === 'std' || m === 'test') S.data.mode = m;    // 版本开关是设置不是进度：重置存档不改它
      S.flush(); return S.data;
    },
    exportJSON: function () { return JSON.stringify(S.data); },

    /* ---- 卡牌 ---- */
    has: function (id) { return !!S.data.cards[id]; },
    lvOf: function (id) { var c = S.data.cards[id]; return c ? c.lv : 1; },
    ownedCount: function () { return Object.keys(S.data.cards).length; },
    upNeed: function (lv) { return lv >= XY.CARD_MAXLV ? 0 : [0, 2, 3, 4, 6][lv]; },       // 当前 lv 升到下一级要多少张重复卡
    // 获得一张卡：新卡入库；已有的算“重复”，攒够张数可以升级
    addCard: function (id) {
      var c = S.data.cards[id], isNew = !c;
      if (!c) c = S.data.cards[id] = { lv: 1, dup: 0, got: 0, first: Date.now() }; else c.dup++;
      c.got++; S.touch();
      return { isNew: isNew, dup: c.dup, lv: c.lv, canUp: c.lv < XY.CARD_MAXLV && c.dup >= S.upNeed(c.lv) };
    },
    upgradeCard: function (id) {
      var c = S.data.cards[id];
      if (!c) return { ok: false, reason: '还没有这张法宝' };
      if (c.lv >= XY.CARD_MAXLV) return { ok: false, reason: '已经是最高等级' };
      var need = S.upNeed(c.lv);
      if (c.dup < need) return { ok: false, reason: '重复的法宝不够：要 ' + need + ' 张，现在 ' + c.dup + ' 张' };
      c.dup -= need; c.lv++; S.touch();

    },

    inDeck: function (id) { return S.data.deck.indexOf(id) >= 0; },
    toggleDeck: function (id) {
      var d = S.data.deck, i = d.indexOf(id);
      if (i >= 0) { d.splice(i, 1); S.touch(); return { ok: true, reason: '已取下' }; }

    skinOf: function (heroId) { var s = S.data.skins[heroId]; return s && S.skinUnlocked(heroId) ? s : 'default'; },
    setSkin: function (heroId, which) {

    setHorseForm: function (f) {
      if (f === 'dragon' && !S.dragonUnlocked()) return { ok: false, reason: '还没解锁小白龙' };

    },
    horseForm: function () { return S.data.party.horse === 'dragon' && S.dragonUnlocked() ? 'dragon' : 'horse'; },

    /* ---- 解锁判定 ---- */
    progress: function (u) {
      var st = S.data.stats, c = u.cond, cur = 0;

      else if (c.type === 'shards') cur = S.data.shards;
      else if (c.type === 'runs') cur = st.runs;
      else if (c.type === 'best') cur = Math.floor(st.bestTime);

  S.load();

  XY.CARDS = []; XY.CARD_BY = {};

      case 'horse':  m.ultCd *= [1, 0.9, 0.8, 0.7][sp]; break;
    }
    // 深度分支 / 常驻角色的主技能精进：fx 统一折算
    var tr = XY.TREE[id], MULK = { dmg: 1, atkSpd: 1, ultPow: 1, move: 1, ultCd: 1, traitCd: 1, healMul: 1, auraMul: 1, stRegen: 1 };
    m.dmg = 1; m.traitCd = 1; m.healMul = 1; m.pdef = 0; m.mdef = 0; m.weakDmg = 0; m.bossDmg = 0; m.typeDmg = { phys: 0, magic: 0 }; m.regen = 0; m.chain = 0;
    if (tr && tr.sp) { if (L('m1')) m.atkSpd *= 1.10; if (L('m2')) { m.dmg *= 1.12; m.atkSpd *= 1.08; } }
    var dtm = (h.def && h.def.dtype) || 'phys', dto = dtm === 'magic' ? 'phys' : 'magic';
    if (tr) tr.nodes.forEach(function (n) {
      if ((n.kind !== 'deep' && n.kind !== 'extra') || !s[n.id]) return;
      var nlv = n.kind === 'extra' ? s[n.id] : 1;      // 专属强化可升多级：效果 × 等级
      Object.keys(n.fx).forEach(function (k) {
        var v = n.fx[k] * nlv;
        if (k === 'tmain') m.typeDmg[dtm] += v; else if (k === 'tother') m.typeDmg[dto] += v;
        else if (MULK[k]) m[k] *= (1 + v);
        else m[k] = (m[k] || 0) + v;
      });
    });
    h.wlv = 1 + L('m1') + L('m2') + L('ma');       // 主技能等级 1~5（沿用武器等级表）
    return m;
  };

  /* ---------- 自动加点（可选）：轮流给每个活着的英雄和全队页加点 ---------- */
  var AUTO_HERO = ['m1', 'm2', 'ma', 'x1', 'x2', 'x3a', 'x4a', 'x5a', 'vital', 'leech', 'sp', 'y1', 'y2', 'y3a', 'y4a', 'y5a', 'fire', 'boom', 'chill', 'swift', 's1', 's2', 's3', 'z1', 'z2', 'z3a', 'z4a', 'z5a']   // 唐僧没有 vital / leech，会被自动跳过;
  var AUTO_PARTY = ['p_dmg', 'p_hp', 'p_camp', 'p_spd', 'p_regen', 'p_ult', 'p_xp', 'p_tower', 'p_move', 'p_pick'];
  XY.autoSpendOne = function (G) {
    var targets = G.heroes.map(function (h, k) { return k; }).concat([-1]), t, i, n = targets.length;
    for (t = 0; t < n; t++) {
      var hi = targets[(G.autoIdx + t) % n], list = hi < 0 ? AUTO_PARTY : AUTO_HERO;

      for (i = 0; i < list.length; i++) {
        if (XY.nodeStatus(G, hi, list[i]).st === 'ok') { XY.learn(G, hi, list[i]); G.autoIdx = (G.autoIdx + t + 1) % n; return true; }
      }
    }
    return false;
  };
  XY.autoSpend = function (G) { var n = 0; while (G.points > 0 && n++ < 60 && XY.autoSpendOne(G)); };
})();

<script>
/* ---- js/journey.js ---- */
/* =====================================================================
 * journey.js —— 取经之旅：一到三关是一段连续的旅程，等级和技能一直带着走（v0.5）
 *
 * 规则（用户 5:48 AM 定的）：
 *  · 过关的那一刻把队伍的成长存进存档（localStorage，刷新页面还在）：
 *      全队等级 / 经验 / 技能点、五位师徒（含唐僧）各自学会的技能和技能树选择、
 *      全队技能页（u_*）、每位特殊角色各自的局内技能（按角色分开存）、这一路收集到的法宝
 *  · 存档里每一关有一份「入场快照」entry[n] = 开始第 n 关时的状态：
 *      第 1 关没有快照 = 从零开始；过关第 n 关写 entry[n+1]，并删掉更靠后的旧快照（旅程只有一条线）
 *      失败不写任何东西 → 重打这一关一定回到这一关开始时的状态，而不是清掉更早的积累
 *  · 每关开局满血；上一关阵亡的师徒下一关带着原来的等级回来；关内死了仍然不复活
 *  · 「重新开始取经」：只清旅程（入场快照 + 关卡进度），法宝收藏 / 灵石 / 角色卡 / 图鉴 / 解锁不动
 *  · 旧存档（schema 1/2）升级：旧档没有成长数据 → journey.legacy = true。
 *      已通关的老玩家进入第 n 关时，用「补偿快照」（按各关推荐等级自动点好技能），不会从零打第 2、3 关
 * ===================================================================== */
(function () {
  'use strict';
  var XY = window.XY, C = XY.C;

  // 补偿快照的等级（老存档用）：按机器人测试中打完上一关的等级偏保守取值
  var LEGACY_LV = { 2: 20, 3: 30 };

  function J() { var d = XY.save.data; if (!d.journey || typeof d.journey !== 'object') d.journey = { entry: {}, legacy: false }; if (!d.journey.entry) d.journey.entry = {}; return d.journey; }
  function copy(o) { return JSON.parse(JSON.stringify(o || {})); }
  function pointsFor(L) { var p = 0, l; for (l = 2; l <= L; l++) p += 1 + (l % C.POINT_BONUS_EVERY === 0 ? 1 : 0); return p; }

  var JR = XY.journey = {
    LEGACY_LV: LEGACY_LV,
    // 开始第 n 关该用的快照（null = 从零开始）
    entryFor: function (n) {
      var j = J(), e = j.entry[n];
      if (e) return e;
      if (n > 1 && j.legacy && XY.save.levelUnlocked(n)) {
        var L = LEGACY_LV[n] || LEGACY_LV[3];
        return { level: L, xp: 0, points: pointsFor(L), pointsTotal: pointsFor(L), autoPoints: true, upg: {}, heroes: {}, sp: {}, runCards: {}, activeCard: null, synthetic: true, from: n - 1 };
      }
      return null;
    },
    // 过关时：把 G 的成长拍成快照，写进 entry[n+1]
    snap: function (G) {
      var prev = JR.entryFor(G.levelId), s = { from: G.levelId, level: G.level, xp: G.xp, points: G.points, pointsTotal: G.pointsTotal, autoPoints: !!G.autoPoints, upg: copy(G.upg), heroes: {}, sp: prev && prev.sp ? copy(prev.sp) : {}, runCards: copy(G.runCards), activeCard: G.activeCard || null, at: Date.now() };
      G.heroes.forEach(function (h) {
        if (h.sp) s.sp[h.id] = { sk: copy(h.sk) };            // 特殊角色：按角色 id 分开存，换人以后各用各的进度
        else s.heroes[h.id] = { sk: copy(h.sk) };
      });
      return s;
    },
    onWin: function (G) {
      var j = J(), n = G.levelId, k;
      j.entry[n + 1] = JR.snap(G);
      for (k in j.entry) if (+k > n + 1) delete j.entry[k];
      j.legacy = false;
      j.done = n >= XY.LEVEL_COUNT;
      XY.save.touch();
    },
    // 开局时：把快照里的成长装回 G（在 recalc 之前调用）
    apply: function (G) {
      var s = JR.entryFor(G.levelId); G.inherit = null;
      if (!s) return null;
      G.level = s.level || 1; G.xp = s.xp || 0; G.points = s.points || 0; G.pointsTotal = s.pointsTotal || 0; G.autoPoints = !!s.autoPoints;
      G.upg = copy(s.upg);
      G.heroes.forEach(function (h) {
        var r = h.sp ? (s.sp && s.sp[h.id]) : (s.heroes && s.heroes[h.id]);
        if (r && r.sk) h.sk = copy(r.sk);
      });
      if (s.runCards) { G.runCards = copy(s.runCards); if (s.activeCard && (G.runCards[s.activeCard] || G.deckIds.indexOf(s.activeCard) >= 0)) G.activeCard = s.activeCard; }
      var dropped = XY.cards.sanitizeCarry ? XY.cards.sanitizeCarry(G) : [];      // 法宝和当前卡组冲突 / 失效的丢掉，不报错、不锁卡组
      XY.cards.recalc(G);
      G.inhMul = 1 + C.INH_K * Math.max(0, (s.level || 1) - 1);
      G.inherit = { level: G.level, synthetic: !!s.synthetic, from: s.from, cards: Object.keys(G.runCards || {}).length, dropped: dropped.length };
      if (dropped.length && XY.toast) XY.toast(G, '上一关带来的 ' + dropped.length + ' 件法宝和现在的卡组不是同一套（或超过 3 件），没有带过来');
      return s;
    },
    afterApply: function (G) {              // recalc 之后：合成快照自动点技能
      if (G.inherit && G.inherit.synthetic && G.points > 0) XY.autoSpend(G);
    },
    // 给界面用的一句话
    status: function (n) {
      var s = JR.entryFor(n);
      if (!s) return { inherit: false, text: n === 1 ? '从零开始' : '从零开始（没有继承的成长）' };
      return { inherit: true, level: s.level, text: '继承：全队 Lv' + s.level + ' · 技能点 ' + (s.points || 0) + (s.synthetic ? '（老存档补偿）' : '') + ' · 法宝 ' + Object.keys(s.runCards || {}).length + ' 张' };
    },
    restart: function () {
      var d = XY.save.data;
      d.journey = { entry: {}, legacy: false }; d.levels = {};
      XY.save.touch(); XY.save.flush();
    }
  };
})();

</script>

      sides: [

        { type: 'kill_all', text: '击退全部三位洞主（每位至少一次）', short: '三洞全败', reward: { card: 'SR', lingshi: 60, shard: 1 } }

    {

      camp: CAMP, route: ROUTES[3], rest: 0.5, walkSec: 360, theme: 'apricot', gate: { x: 300, y: 1600, name: '火焰山关' },
      rate: 1.20, mul: 2.00, bossMul: 4.0, swarmN: 22, eliteN: 2,

      ]

  ];

  XY.routeBuild = function (L) {
    var pts = L.route.map(function (p) { return { x: p[0], y: p[1] }; }), cum = [0], i, tot = 0;
    for (i = 1; i < pts.length; i++) { tot += XY.dist(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y); cum.push(tot); }
    return { pts: pts, cum: cum, total: tot, restS: tot * (L.rest || 0.5) };
  };
  XY.routeAt = function (R, s) {
    s = XY.clamp(s, 0, R.total);
    var i = 1; while (i < R.pts.length - 1 && R.cum[i] < s) i++;
    var a = R.pts[i - 1], b = R.pts[i], seg = R.cum[i] - R.cum[i - 1] || 1, f = (s - R.cum[i - 1]) / seg;
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, a: Math.atan2(b.y - a.y, b.x - a.x) };
  };
  // 把任意坐标投影到路线：返回 { s: 路线进度, d: 离路线多远 }
  XY.routeProject = function (R, x, y) {

    for (i = 1; i < R.pts.length; i++) {
      var a = R.pts[i - 1], b = R.pts[i], dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy || 1;
      var f = XY.clamp(((x - a.x) * dx + (y - a.y) * dy) / l2, 0, 1), px = a.x + dx * f, py = a.y + dy * f, d = XY.dist(x, y, px, py);
      if (d < best.d) best = { s: R.cum[i - 1] + (R.cum[i] - R.cum[i - 1]) * f, d: d };
    }
    return best;
  };
  XY.levelOf = function (id) { return XY.LEVELS[Math.max(1, Math.min(XY.LEVEL_COUNT, id | 0 || 1)) - 1]; };

  /* ================= 任务系统 ================= */
  var Q = XY.quests = {};

  function mkQ(def, kind, idx) { return { def: def, kind: kind, idx: idx, done: false, failed: false, prog: '', pv: 0, pmax: 1 }; }

  // 开局：建任务表、被困者、宝物
  Q.init = function (G) {

    G.captives = (L.captives || []).map(function (c) { return { id: c.id, name: c.name, x: c.x, y: c.y, hold: c.hold, t: 0, freed: false, r: 90 }; });

  };

  function den(G, i) { return G.dens[i]; }
  function capOf(G, id) { for (var i = 0; i < G.captives.length; i++) if (G.captives[i].id === id) return G.captives[i]; return null; }

  function evalQ(G, q) {

      case 'rescue': var c = capOf(G, d.cap); q.pv = c.freed ? 1 : c.t / c.hold; q.pmax = 1; q.prog = c.freed ? '已救出' : Math.floor(c.t) + '/' + c.hold + ' 秒'; if (c.freed) q.done = true; break;
      case 'item': q.pv = G.itemGot[d.item] ? 1 : 0; q.pmax = 1;

      case 'time_den':

        if (dd.beaten) { q.pv = 1; q.prog = '已击退'; if (dd.deadT <= d.sec) q.done = true; else { q.failed = true; q.prog = '超时'; } }

        else q.prog = '剩 ' + XY.fmtTime(left);
        break;

})();

  function runEvent(G, ev) {

  // 调试：直接跳到某个时间点，跳过的事件不再补发

    XY.updateVolume(G, dt);
    XY.updateAbilities(G, dt);
    updateEnemies(G, dt);
    XY.updateAllies(G, dt);
    XY.updateSoldiers(G, dt);
    updateTowers(G, dt);
    updateProjs(G, dt);
    updateZones(G, dt);
    updatePickups(G, dt);

    XY.quests.update(G, dt);

  };

  // 师父的威胁：离他最近的妖怪（营地圈里的优先）、正朝他飞来的妖怪弹幕；营地圈里有妖怪 = 红色警报

    var fx = ctrl.x + cos(fa) * SLOT_R, fy = ctrl.y + sin(fa) * SLOT_R;

  // 主动出击选目标：洞府 BOSS（700 内）> 妖塔 > 精英 > 最密的怪堆（离自己近、周围怪多的优先）

  // 唐僧：独立状态机 walk（走向休息点）→ rest（休息 5 分钟，不能提前结束）→ walk2（走向关口）→ arrived

        }

        if (dd > 6) {
          var s2 = h.id === 'tang' ? Math.min(sp, dd * 6) : Math.min(sp * 1.15 * (dd > 220 || gl.run ? 1.6 : 1), dd * 6);   // 唐僧走得慢：没有追赶加速
          vx = dx / dd * s2; vy = dy / dd * s2; h.moving = true; h.face = atan2(vy, vx);
        }
      }
      if (i > 0) { h.x = clamp(h.x + vx * dt, h.def.r, C.WORLD_W - h.def.r); h.y = clamp(h.y + vy * dt, h.def.r, C.WORLD_H - h.def.r); }
      // 英雄之间轻微互相推开，别叠成一团
      for (j = i + 1; j < G.heroes.length; j++) {
        var o = G.heroes[j]; if (o.down || o.ridden || h.ridden) continue;          // 白龙马贴在骑手脚下：不参与互相推开（否则骑手会被推着漂）
        var ddx = o.x - h.x, ddy = o.y - h.y, d2 = ddx * ddx + ddy * ddy, md = 30;
        if (d2 < md * md && d2 > 0.01) { var dl = sqrt(d2), pu = (md - dl) * 0.1; if (i > 0) { h.x -= ddx / dl * pu; h.y -= ddy / dl * pu; } if (j > 0) { o.x += ddx / dl * pu; o.y += ddy / dl * pu; } }   // 唐僧不会被推动

  }

  /* ---------- 各英雄的自动攻击 ---------- */
  function attack(G, h, dt) {
    switch (h.id) {
      case 'wukong': return atkWukong(G, h, dt);
      case 'bajie': return atkBajie(G, h, dt);
      case 'wujing': return atkWujing(G, h, dt);
      case 'horse': return atkHorse(G, h, dt);
      case 'tang': return atkTang(G, h, dt, false);
      default: if (h.sp && XY.specialAtk) return XY.specialAtk(G, h, dt);
    }
  }
  function cdScale(G, h) { return 1 / (h.atkSpd * G.P.spd); }

  // 扇形横扫
  function sweep(G, h, ang, range, arc, dmgBase, kb) {
    var full = arc >= PI2 - 0.01;
    G.fx.push({ type: 'arc', x: h.x, y: h.y, ang: ang, range: range, arc: arc, t: 0, max: 0.22, color: h.def.color, owner: h });
    G.grid.query(h.x, h.y, range, function (e) {
      if (!full) {
        var da = Math.abs(((atan2(e.y - h.y, e.x - h.x) - ang + 3 * Math.PI) % PI2) - Math.PI);
        if (da > arc / 2 + e.r / (XY.dist(h.x, h.y, e.x, e.y) + 1)) return;
      }
      var dm = heroDmg(G, h, dmgBase);
      hurtEnemy(G, e, dm, { src: h, kb: kb, fx: h.x, fy: h.y, crit: G._crit });
    });
  }

  function atkWukong(G, h, dt) {
    var L = h.wlv;
    h.atkT -= dt; if (h.atkT > 0) return;
    var range = 110 + 12 * (L - 1) + (L >= 4 ? 8 : 0);
    var tgt = G.grid.nearest(h.x, h.y, range + 20);
    if (!tgt) { h.atkT = 0.05; return; }
    var ang = atan2(tgt.y - h.y, tgt.x - h.x), arc = L >= 5 ? PI2 : 2.3 + 0.12 * (L - 1);
    var dmg = 34 * (1 + 0.3 * (L - 1));
    h.face = ang;
    sweep(G, h, ang, range, arc, dmg, 220);
    if (L >= 3 && arc < PI2) h.pend.push({ t: 0.22, fn: function () { if (!h.down) sweep(G, h, ang + Math.PI, range, arc, dmg * 0.8, 160); } });
    h.atkT = h.atkMax = (0.8 - 0.03 * (L - 1)) * cdScale(G, h);
  }

  function atkBajie(G, h, dt) {
    var L = h.wlv;
    h.atkT -= dt; if (h.atkT > 0) return;
    var R = 92 + 7 * (L - 1) + (L >= 4 ? 8 : 0);
    var tgt = G.grid.nearest(h.x, h.y, R + 50);
    if (!tgt) { h.atkT = 0.05; return; }
    var ang = atan2(tgt.y - h.y, tgt.x - h.x), dist = Math.min(55, XY.dist(h.x, h.y, tgt.x, tgt.y));
    var cx = h.x + cos(ang) * dist, cy = h.y + sin(ang) * dist, dmg = 55 * (1 + 0.3 * (L - 1));
    h.face = ang;
    var slam = function (rad, dm) {
      ring(G, cx, cy, rad, h.def.color, 0.35, true);
      G.shake = Math.max(G.shake, 3);
      G.grid.query(cx, cy, rad, function (e) {
        hurtEnemy(G, e, heroDmg(G, h, dm), { src: h, kb: 650, fx: cx, fy: cy, stun: L >= 3 ? 0.5 : 0, crit: G._crit });
      });
    };
    slam(R, dmg);
    if (L >= 5) h.pend.push({ t: 0.4, fn: function () { if (!h.down) slam(R * 1.25, dmg * 0.6); } });
    h.atkT = h.atkMax = (1.4 - 0.07 * (L - 1)) * cdScale(G, h);
  }

  function atkWujing(G, h, dt) {
    var L = h.wlv, n = [3, 3, 4, 4, 5][L - 1];
    var R = 70 + 5 * (L - 1), br = 12 + L, spd = 3 + (L >= 3 ? 1 : 0) + (L >= 5 ? 0.6 : 0);
    var dmg = 17 * (1 + 0.25 * (L - 1)) * 1.4;
    // 骷髅念珠：转 3.5 秒、歇 1.5 秒（有明确的冷却），转的时候伤害 ×1.4
    if (h.beadOn > 0) {
      h.beadOn -= dt;
      if (h.beadOn <= 0) { h.beadOn = 0; h.beadRest = C.BEAD_REST; h.beads = 0; return; }
    } else {
      h.beadRest -= dt; h.beads = 0;
      if (h.beadRest <= 0) { h.beadOn = C.BEAD_ON; ring(G, h.x, h.y, 50, h.def.color, 0.3); }
      return;
    }
    h.orbit += dt * spd * G.P.spd * h.atkSpd;
    h.beads = n; h.beadR = R; h.beadSize = br;
    for (var i = 0; i < n; i++) {
      var a = h.orbit + i / n * PI2, bx = h.x + cos(a) * R, by = h.y + sin(a) * R;
      G.grid.query(bx, by, br, function (e) {
        if (G.t >= e.beadT) {
          e.beadT = G.t + 0.35;
          hurtEnemy(G, e, heroDmg(G, h, dmg), { src: h, kb: 140, fx: h.x, fy: h.y, crit: G._crit });
        }
      });
    }
  }

  function atkHorse(G, h, dt) {
    var L = h.wlv;
    h.atkT -= dt; if (h.atkT > 0) return;
    var tgt = G.grid.nearest(h.x, h.y, 380);
    if (!tgt) { h.atkT = 0.05; return; }
    var base = atan2(tgt.y - h.y, tgt.x - h.x), shots = L >= 5 ? 3 : (L >= 3 ? 2 : 1);
    var dmg = 20 * (1 + 0.28 * (L - 1)), pierce = 2 + Math.floor(L / 2);
    h.face = base;
    for (var i = 0; i < shots; i++) {
      var a = base + (i - (shots - 1) / 2) * 0.16;
      G.projs.push({ x: h.x, y: h.y, vx: cos(a) * 440, vy: sin(a) * 440, dmg: heroDmg(G, h, dmg), crit: G._crit, r: 7, life: 0.9, pierce: pierce, hits: [], kind: 'water', src: h });
    }
    h.atkT = h.atkMax = (0.6 - 0.04 * (L - 1)) * cdScale(G, h);
  }

  function atkTang(G, h, dt, stationed) {
    var L = h.wlv, auraR = 125 + 12 * (L - 1);
    h.auraR = auraR;
    // 佛光：每 3 秒一次脉冲，给范围内的队友回血（总量和以前持续回血相同）
    h.pulseT += dt;
    if (h.pulseT >= C.TANG_PULSE) {
      h.pulseT = 0;
      for (var i = 0; i < G.heroes.length; i++) {
        var o = G.heroes[i];
        if (!o.down && XY.dist(h.x, h.y, o.x, o.y) <= auraR + 6) healHero(G, o, h.auraHeal * C.TANG_PULSE, true);
      }
      ring(G, h.x, h.y, auraR, '#f2c14e', 0.5);
    }
    if (stationed) { h.atkT = Math.max(h.atkT, 0.3); h.face = Math.PI / 2; return; }   // 驻守营地：只回血、不攻击（不灼烧、不射经文）
    // 4 级起灼烧范围内敌人
    h.auraT += dt;
    if (h.auraT >= 0.5) {
      h.auraT = 0;
      if (L >= 4) {
        var dm = (8 + (L >= 5 ? 6 : 0)) * 0.5 * h.dmgMul * G.P.dmg;
        G.grid.query(h.x, h.y, auraR, function (e) { hurtEnemy(G, e, dm, { dot: true, src: h }); });
      }
    }
    // 经文：弱远程
    h.atkT -= dt; if (h.atkT > 0) return;
    var tgt = G.grid.nearest(h.x, h.y, 320);
    if (!tgt) { h.atkT = 0.05; return; }
    var a = atan2(tgt.y - h.y, tgt.x - h.x), dmg = 13 * (1 + 0.3 * (L - 1)) * (L >= 5 ? 1.3 : 1);
    h.face = a;
    G.projs.push({ x: h.x, y: h.y, vx: cos(a) * 380, vy: sin(a) * 380, dmg: heroDmg(G, h, dmg), crit: G._crit, r: 6, life: 0.9, pierce: 1, hits: [], kind: 'sutra', src: h });
    h.atkT = h.atkMax = (1.2 - 0.07 * (L - 1)) * cdScale(G, h);
  }

  /* ---------- 大招（只有当前操控的英雄能放） ---------- */
  // 大招全部自动释放（v0.2 起玩家只负责走位，不再有手动大招键）：每个活着的英雄在冷却好、
  // 场上满足条件时自己放；操控中的英雄和自动英雄用同一套判断
  function countNear(G, x, y, r) { var n = 0, boss = false; G.grid.query(x, y, r, function (e) { n++; if (e.def.boss) boss = true; }); return { n: n, boss: boss }; }
  function wantUlt(G, h) {
    var c, i, o, low = 0, lowest = 1;
    switch (h.id) {
      case 'wukong': c = countNear(G, h.x, h.y, 280); return c.n >= 6 || (c.boss && c.n >= 1) || (c.n >= 3 && h.hp < h.maxHp * 0.4);
      case 'bajie':  c = countNear(G, h.x, h.y, 240); return c.n >= 5 || (c.boss && c.n >= 1) || (c.n >= 3 && h.hp < h.maxHp * 0.4);
      case 'wujing': c = countNear(G, h.x, h.y, 200); return c.n >= 6 || (c.boss && c.n >= 1);
      case 'horse':  c = countNear(G, h.x, h.y, 300); return c.n >= 5 || (c.boss && c.n >= 1);
      case 'tang':
        for (i = 0; i < G.heroes.length; i++) { o = G.heroes[i]; if (o.down) continue; var f = o.hp / o.maxHp; if (f < 0.5) low++; if (f < lowest) lowest = f; }
        c = countNear(G, h.x, h.y, 230);
        if (lowest < 0.35 || low >= 2) return true;                     // 有人快不行了：佛光普照
        return G.station && c.n >= 8;                                  // 驻守时营地门口被围：震退一圈
      default: if (h.sp && XY.specialWant) return XY.specialWant(G, h);
    }
    return false;
  }
  function autoUlt(G, h) { if (h.down || h.ultCd > 0 || h.dash || G.mode !== 'play') return false; if (!wantUlt(G, h)) return false; return castUlt(G, h); }
  function castUlt(G, h) {
    if (G.mode !== 'play' || h.down || h.ultCd > 0) return false;
    h.ultCd = XY.ultCdOf(G, h);
    if (XY.syn) XY.syn.onUlt(G, h);
    var inp = G.input, i, up = h.mod.ultPow;
    switch (h.id) {
      case 'wukong':
        ring(G, h.x, h.y, 300, '#ef8a3c', 0.5, true); G.shake = 8;
        G.grid.query(h.x, h.y, 300, function (e) {
          hurtEnemy(G, e, heroDmg(G, h, 170 * up), { src: h, kb: 900, fx: h.x, fy: h.y, stun: 1.2, crit: G._crit });
        });
        break;
      case 'bajie':
        var nt = G.grid.nearest(h.x, h.y, 320), dx = nt ? nt.x - h.x : cos(h.face), dy = nt ? nt.y - h.y : sin(h.face), l = sqrt(dx * dx + dy * dy) || 1;
        h.dash = { t: 0.35, dx: dx / l, dy: dy / l, speed: 330 / 0.35, id: G.nextId++ };
        h.inv = 0.5; G.shake = 5;
        break;
      case 'wujing':
        G.zones.push({ x: h.x, y: h.y, r: 190 * up, t: 7, max: 7, tick: 0, dmg: 30 * h.dmgMul * G.P.dmg * up, owner: h });
        ring(G, h.x, h.y, 190 * up, '#c9a96b', 0.5, true);
        break;
      case 'horse':
        for (i = 0; i < 18; i++) {
          var a = i / 18 * PI2;
          G.projs.push({ x: h.x, y: h.y, vx: cos(a) * 520, vy: sin(a) * 520, dmg: heroDmg(G, h, 70 * up), crit: G._crit, r: 9, life: 0.9, pierce: 5, hits: [], kind: 'water', src: h });
        }
        ring(G, h.x, h.y, 120, '#6fcfd8', 0.4, true);
        break;
      case 'tang':                                    // 只回血，不复活阵亡的队友
        G.heroes.forEach(function (o) {
          if (o.down) return;
          healHero(G, o, o.maxHp * 0.5, true);
          if (o.id !== 'tang') o.inv = Math.max(o.inv, 1.5);   // 唐僧不吃任何加成：没有这点无敌
        });
        ring(G, h.x, h.y, 230, '#f2c14e', 0.6, true); G.shake = 6;
        G.grid.query(h.x, h.y, 230, function (e) {
          if (G.station) { var dx0 = e.x - h.x, dy0 = e.y - h.y, dl0 = sqrt(dx0 * dx0 + dy0 * dy0) || 1, kr = 700 * (1 - e.def.knockRes); e.kx += dx0 / dl0 * kr; e.ky += dy0 / dl0 * kr; }   // 驻守时只震退，不造成伤害
          else hurtEnemy(G, e, heroDmg(G, h, 50 * up), { src: h, kb: 700, fx: h.x, fy: h.y, crit: G._crit });
        });
        break;
      default: if (h.sp && XY.specialUlt) XY.specialUlt(G, h);
    }
    banner(G, h.def.name + '：' + h.def.ult + '！', 1.0);
    return true;
  }
  XY.castUlt = castUlt;

  // 换人：被选中的英雄变成“手动”；原来操控的英雄回到它最后一次的自动命令
  XY.switchHero = function (G, i) {
    if (G.mode !== 'play' || i === G.ctrl) return;
    var h = G.heroes[i];
    if (!h) return;
    if (i === 0) { toast(G, '唐僧自己赶路，任何输入都控制不了他'); return; }
    if (h.down) { toast(G, h.def.name + ' 已阵亡，本局不能再出战'); return; }
    G.ctrl = i;
    ring(G, h.x, h.y, 36, h.def.color, 0.35);
  };

  // 给自动英雄下命令（手动英雄也可以先设好，等他松手后生效）
  XY.setOrder = function (G, i, order) {
    var h = G.heroes[i];
    if (!h || XY.ORDERS.indexOf(order) < 0) return false;
    if (i === 0) { toast(G, '唐僧自己赶路，不接受命令'); return false; }
    if (h.down) { toast(G, h.def.name + ' 已阵亡，不能再下命令'); return false; }
    if (order === 'guard' && h.id === 'tang') { toast(G, '唐僧不能守护自己，请选别的命令'); return false; }
    h.order = order; h.retreat = false; h.tgt = null;
    toast(G, h.def.name + '：' + XY.ORDER_NAME[order] + (G.ctrl === i ? '（你正在操控他，松手后生效）' : ''));
    return true;
  };
  XY.cycleOrder = function (G, i) {
    var h = G.heroes[i]; if (!h) return false;
    if (i === 0) { toast(G, '唐僧自己赶路，不接受命令'); return false; }
    if (h.down) { toast(G, h.def.name + ' 已阵亡，不能再下命令'); return false; }
    var k = XY.ORDERS.indexOf(h.order), n = XY.ORDERS.length;
    for (var t = 1; t <= n; t++) {
      var o = XY.ORDERS[(k + t) % n];
      if (o === 'guard' && h.id === 'tang') continue;
      return XY.setOrder(G, i, o);
    }
    return false;
  };

  /* ================= 敌人 ================= */
  // 目标优先级：唐僧 / 徒弟 / 营地 > 天兵（天兵永远是最后的目标）。
  // 英雄或营地在警戒范围内就打他们；只有警戒范围内没有任何英雄时才会转去打天兵。
  function pickTarget(G, e) {
    var nh = G.heroes, d = e.def, best = null, bd = Infinity, j, h, ddx, ddy, dd;
    var lure = XY.spsupLure(G, e); if (lure) return lure;           // 人菜话多 / 截图分身：把怪引到自己身上
    for (j = 1; j < G.heroes.length; j++) {                          // 钉耙挡灾的嘲讽：范围内的妖怪只打他
      h = nh[j]; if (h.down || !(h.taunt > 0)) continue;
      if (XY.dist(h.x, h.y, e.x, e.y) < C.TAUNT_R) return h;
    }
    for (j = 0; j < G.heroes.length; j++) {
      h = nh[j]; if (h.down || h.ridden) continue;      // 正在被骑的白龙马不会被妖怪盯上
      ddx = h.x - e.x; ddy = h.y - e.y; dd = ddx * ddx + ddy * ddy;
      if (j === 0) { if (d.boss && XY.bossBarrier(G)) continue; dd *= C.TANG_TARGET_W; }          // 唐僧在“距离”上显得更远：妖怪优先找别人，除非他离得明显更近
      else if (h.order === 'guard' && XY.dist(h.x, h.y, nh[0].x, nh[0].y) < 280) dd *= C.GUARD_TAUNT;   // 守护师傅的英雄把怪引到自己身上
      if (dd < bd) { bd = dd; best = h; }
    }
    if (best && XY.dist(best.x, best.y, e.x, e.y) <= C.ALLY_AGGRO) return best;
    var al = null, ad = C.ALLY_AGGRO;
    for (j = 0; j < G.allies.length; j++) {
      var a = G.allies[j]; if (a.dead) continue;
      var dl = XY.dist(a.x, a.y, e.x, e.y); if (dl < ad) { ad = dl; al = a; }
    }
    for (j = 0; j < G.towers.length; j++) {                // v0.5：护法天兵（原来的塔）和降临天兵同级，优先级都是最低
      var tw0 = G.towers[j], dl2 = XY.dist(tw0.x, tw0.y, e.x, e.y); if (dl2 < ad) { ad = dl2; al = tw0; }
    }
    return al || best;
  }
  XY.pickTarget = pickTarget;

  // 妖塔：建好后向射程内的 英雄 / 我方塔 开火，最后才打天兵
  function etowerAI(G, e, dt) {
    var den = G.dens[e.den];
    if (e.building > 0) {
      e.building -= dt;
      if (e.building <= 0) { e.building = 0; ring(G, e.x, e.y, 90, '#8a5fc0', 0.5, true); text(G, e.x, e.y - 34, '妖塔建成', 'big'); }
      return;
    }
    if (e.fire > 0) e.fire -= dt;
    e.shootT -= dt; if (e.shootT > 0) return;
    var R = C.ETOWER_RANGE, best = null, bd = Infinity, i, o, dd;
    for (i = 0; i < G.heroes.length; i++) {
      o = G.heroes[i]; if (o.down || (i === 0 && false)) continue;
      dd = XY.dist(o.x, o.y, e.x, e.y); if (dd < R && dd < bd) { bd = dd; best = o; }
    }
    if (!best) {                                            // v0.5：天兵（塔 + 降临天兵）统一排在最后
      var soldiers = XY.soldiersOf(G);
      for (i = 0; i < soldiers.length; i++) {
        o = soldiers[i]; dd = XY.dist(o.x, o.y, e.x, e.y); if (dd < R && dd < bd) { bd = dd; best = o; }
      }
    }
    if (!best) { e.shootT = 0.25; return; }
    var dx = best.x - e.x, dy = best.y - e.y, l = sqrt(dx * dx + dy * dy) || 1;
    G.eprojs.push({ x: e.x, y: e.y - 20, vx: dx / l * 260, vy: dy / l * 260, dmg: e.dmg, r: 7, life: R / 260 + 0.3, src: 'etower', dt: 'magic', el: 'earth' });
    e.shootT = C.ETOWER_CD; e.fire = 0.2;
  }

  function updateEnemies(G, dt) {
    var list = G.enemies, camp = G.camp, nh = G.heroes, i, j, k, cgoal = camp.active ? camp : { x: nh[0].x, y: nh[0].y, r: nh[0].def.r };
    G.boss = null;
    for (i = 0; i < G.dens.length; i++) { var db = G.dens[i].boss; if (db && !db.dead && db.engaged) { if (!G.boss || XY.dist(db.x, db.y, nh[G.ctrl].x, nh[G.ctrl].y) < XY.dist(G.boss.x, G.boss.y, nh[G.ctrl].x, nh[G.ctrl].y)) G.boss = db; } }
    for (i = 0; i < list.length; i++) {
      var e = list[i]; if (e.dead) continue;
      var d = e.def;
      if (e.flash > 0) e.flash -= dt;
      if (e.markT > 0) e.markT -= dt;
      // 灼烧
      if (e.btcT > 0) { XY.btcBurnTick(G, e, dt); if (e.dead) continue; }       // Phyrex 的 BTC 灼烧（烧死了就不再移动 / 接触伤害）
      if (e.burnT > 0) {
        e.burnT -= dt; e.burnAcc += dt;
        if (e.burnAcc >= 0.5) { e.burnAcc -= 0.5; hurtEnemy(G, e, e.burnDps * 0.5, { dot: true, type: 'magic', elem: 'fire' }); if (e.dead) continue; }
      }
      var spdMul = 1;
      if (e.slowT > 0) { e.slowT -= dt; spdMul = 1 - e.slowF; if (e.slowT <= 0) e.slowF = 0; }
      if (e.stunT > 0) { e.stunT -= dt; spdMul = 0; }

      // 洞府 BOSS：+5%/分钟持续成长（血量上限和当前血量一起涨，放任不管会越来越强）
      if (d.denBoss) {
        var inc = e.baseHp * C.BOSS_SCALE * dt / 60;
        e.hp += inc; e.maxHp += inc; e.dmg = e.baseDmg * (1 + C.BOSS_SCALE * G.t / 60) * (e.raidDmg || 1);
      }
      if (d.etower) { etowerAI(G, e, dt); continue; }
      if (e.affix) XY.affixTick(G, e, dt);
      // 选目标：随机一部分冲营地，其余按优先级找（英雄 > 天兵）
      e.retarget -= dt;
      if (e.retarget <= 0) { e.retarget = 0.35 + Math.random() * 0.2; e.th = pickTarget(G, e); }
      if (e.th && (e.th.down || e.th.dead)) e.th = null;
      var tx, ty, tr;
      if (e.toCamp || !e.th) { tx = cgoal.x; ty = cgoal.y; tr = cgoal.r; }
      else { tx = e.th.x; ty = e.th.y; tr = e.th.def ? e.th.def.r : C.SOLDIER_R; }
      var dx = tx - e.x, dy = ty - e.y, dist = sqrt(dx * dx + dy * dy) || 1;
      var mvx = 0, mvy = 0;

      if (d.denBoss) { bossAI(G, e, dt, dx / dist, dy / dist, dist); continue; }

      if (d.range) {                                   // 远程：保持距离并射击
        if (dist > d.keep) { mvx = dx / dist; mvy = dy / dist; }
        else if (dist < d.keep * 0.6) { mvx = -dx / dist; mvy = -dy / dist; }
        if (e.stunT <= 0 && dist < d.range) {
          e.shootT -= dt;
          if (e.shootT <= 0) {
            e.shootT = 2.6 + Math.random() * 0.8;
            G.eprojs.push({ x: e.x, y: e.y, vx: dx / dist * 210, vy: dy / dist * 210, dmg: e.dmg, r: 6, life: 3, dt: d.dtype, el: e.elem });
          }
        }
      } else if (dist > e.r + tr - 4) { mvx = dx / dist; mvy = dy / dist; }

      var sp = e.speed * spdMul;
      e.x += mvx * sp * dt + e.kx * dt; e.y += mvy * sp * dt + e.ky * dt;
      var kd = exp(-8 * dt); e.kx *= kd; e.ky *= kd;

      // 挤开旁边的敌人（用网格找邻居）
      var g = G.grid, cs = g.cell, cx = Math.floor(e.x / cs), cy = Math.floor(e.y / cs);
      for (var ny = cy - 1; ny <= cy + 1; ny++) {
        if (ny < 0 || ny >= g.rows) continue;
        for (var nx = cx - 1; nx <= cx + 1; nx++) {
          if (nx < 0 || nx >= g.cols) continue;
          var cell = g.cells[ny * g.cols + nx];
          for (k = 0; k < cell.length; k++) {
            var o = cell[k]; if (o === e || o.dead) continue;
            var ox = e.x - o.x, oy = e.y - o.y, md = (e.r + o.r) * 0.85, d2 = ox * ox + oy * oy;
            if (d2 < md * md && d2 > 0.01) { var dl = sqrt(d2), pu = (md - dl) * 0.35; e.x += ox / dl * pu; e.y += oy / dl * pu; }
            else if (d2 <= 0.01) { e.x += Math.random() - 0.5; e.y += Math.random() - 0.5; }
          }
        }
      }
      e.x = clamp(e.x, 10, C.WORLD_W - 10); e.y = clamp(e.y, 10, C.WORLD_H - 10);

      // 接触伤害：碰到英雄或营地就咬一口
      e.atkT -= dt;
      if (e.atkT <= 0 && e.stunT <= 0) {
        var hit = false;
        for (j = 0; j < G.heroes.length; j++) {
          var hh = nh[j]; if (hh.down) continue;
          var rx = hh.x - e.x, ry = hh.y - e.y, rr = e.r + hh.def.r;
          if (rx * rx + ry * ry < rr * rr) { if (hh.contactT > 0) continue; hurtHeroBy(G, hh, e.dmg, true, undefined, d.dtype, e.elem); hit = true; break; }
        }
        if (!hit && camp.active) {
          var cxx = camp.x - e.x, cyy = camp.y - e.y, crr = e.r + camp.r;
          if (cxx * cxx + cyy * cyy < crr * crr) { hurtCamp(G, e.dmg * 0.3); hit = true; }
        }
        if (!hit) {                                     // 天兵只有“挡了路”（碰到了身体）才会被咬，优先级最低
          var sol = XY.soldiersOf(G);
          for (j = 0; j < sol.length; j++) {
            var al = sol[j];
            var ax = al.x - e.x, ay = al.y - e.y, ar = e.r + (al.type ? C.SOLDIER_R : al.def.r);
            if (ax * ax + ay * ay < ar * ar) { XY.hurtSoldier(G, al, e.dmg * (al.type ? 0.8 : 1)); hit = true; break; }
          }
        }
        if (hit) e.atkT = 0.8;
      }
    }
    // 清理已死亡的敌人（原地压缩数组）
    var w = 0;
    for (i = 0; i < list.length; i++) if (!list[i].dead) list[w++] = list[i];
    list.length = w;
  }

  /* ---------- Boss：冲锋 / 弹幕 / 召唤 三招轮换 ---------- */
  // 佛光结界：只要还有徒弟活着，牛魔王就近不了师父（它的弹幕射程也到不了），只能追着徒弟打——Boss 战是徒弟们的事
  XY.bossBarrier = function (G) {
    for (var i = 1; i < G.heroes.length; i++) if (!G.heroes[i].down) return !G.heroes[0].down;
    return false;
  };
  function bossKeepAway(G, e) {
    if (!XY.bossBarrier(G)) return;
    var t = G.heroes[0], dx = e.x - t.x, dy = e.y - t.y, d = sqrt(dx * dx + dy * dy) || 1;
    if (d < C.BOSS_KEEP) { e.x = t.x + dx / d * C.BOSS_KEEP; e.y = t.y + dy / d * C.BOSS_KEEP; }
  }

  // 每个洞府 BOSS 的招式轮换：charge 冲锋 / shot 弹幕 / summon 召唤 / slam 震地
  var KITS = {
    bull: ['charge', 'shot', 'summon'], bear: ['charge', 'slam', 'summon'], bone: ['shot', 'summon', 'charge'],
    jin: ['shot', 'summon', 'charge'], red: ['charge', 'shot', 'charge'], yellow: ['shot', 'slam', 'summon'],
    iron: ['slam', 'shot', 'summon'], yumian: ['summon', 'shot', 'charge'], chiyan: ['charge', 'slam', 'shot']
  };

  function bossAI(G, e, dt, ux, uy, dist) {
    var th = e.th, cd = e.phase === 2 ? 3.2 : 4.6, name = e.def.name, kit = KITS[e.def.kit] || KITS.bull;
    if (e.flash > 0) e.flash -= dt;
    // —— 洞府守卫：有英雄靠近（850）才出来迎战；追出 1250 太远就回洞口并回血 ——
    var nd = Infinity, i, hh0;
    for (i = 0; i < G.heroes.length; i++) {                                    // v0.5 第 4 批：唐僧自己路过不惊动洞主（要近到 DEN_AGGRO_TANG 才算）；徒弟 / 特殊角色靠近 850 才会“引”出洞主
      hh0 = G.heroes[i]; if (hh0.down) continue;
      var d0 = XY.dist(hh0.x, hh0.y, e.x, e.y); if (i === 0) d0 = d0 * (C.DEN_AGGRO / C.DEN_AGGRO_TANG);
      if (d0 < nd) nd = d0;
    }
    if (!e.home) e.home = { x: e.x, y: e.y };
    var hd = XY.dist(e.x, e.y, e.home.x, e.home.y);
    if (e.retreatT > 0) {                               // 败退：无敌，朝洞口跑，到洞口后继续养伤，时间到恢复血量再出来
      e.retreatT -= dt; e.engaged = false; e.bstate = 'idle'; e.stunT = 0;
      if (hd <= 12) e.hidden = true;                    // 跑到洞口 = 躲进洞里，这时才打不到
      if (hd > 12) { var rx0 = (e.home.x - e.x) / hd, ry0 = (e.home.y - e.y) / hd; e.x += rx0 * e.speed * 2.2 * dt; e.y += ry0 * e.speed * 2.2 * dt; }
      if (e.retreatT <= 0) { e.hidden = false; e.hp = Math.max(e.hp, e.maxHp * C.RETREAT_HEAL); text(G, e.x, e.y - e.r - 20, '养好伤了', 'heal'); }
      return;
    }
    if (!e.engaged) {
      if (nd < C.DEN_AGGRO) { e.engaged = true; if (XY.anim) XY.anim.bossIn(G, e); e.bt = Math.max(e.bt, 1.2); toast(G, name + ' 出洞迎战！'); ring(G, e.x, e.y, 120, e.def.color, 0.6); G.shake = Math.max(G.shake, 4); G.stats.drawOuts = (G.stats.drawOuts || 0) + 1; }
    } else if ((nd > C.DEN_LEASH || hd > C.DEN_LEASH) && !(e.raid > G.t)) e.engaged = false;     // 出征中不受“追出太远就回洞”限制
    if (!e.engaged) {
      e.bstate = 'idle'; e.stunT = 0;
      if (hd > 12) { var hx = (e.home.x - e.x) / hd, hy = (e.home.y - e.y) / hd; e.x += hx * e.speed * 1.3 * dt; e.y += hy * e.speed * 1.3 * dt; }
      e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.02 * dt);
      return;
    }
    if (e.stunT > 0) { e.stunT -= dt; bossKeepAway(G, e); return; }   // 撞晕了：什么都不做
    if (e.hp < e.maxHp * 0.5 && e.phase === 1) { e.phase = 2; banner(G, name + '发怒了！', 3); ring(G, e.x, e.y, 150, '#ff5a3c', 0.6, true); G.shake = 10; }
    var spdMul = e.slowT > 0 ? 1 - e.slowF : 1;
    if (e.slowT > 0) { e.slowT -= dt; }
    var mvx = 0, mvy = 0, sp = e.speed * spdMul, dmgR = e.dmg / e.def.dmg;
    e.bt -= dt;
    if (e.bstate === 'idle') {
      if (dist > e.r + 20) { mvx = ux; mvy = uy; }
      if (e.bt <= 0) {
        var skill = kit[e.bi++ % 3];
        if (skill === 'charge' && th) {                // 冲锋：先画出预警线
          e.bstate = 'tele'; e.bt = 1.0;
          var ddx = th.x - e.x, ddy = th.y - e.y, l = sqrt(ddx * ddx + ddy * ddy) || 1;
          e.cdx = ddx / l; e.cdy = ddy / l;
        } else if (skill === 'slam') {                 // 震地：先画出圈，0.9 秒后落下
          e.bstate = 'slam'; e.bt = 0.9; e.slamR = 170;
        } else if (skill === 'shot' || skill === 'charge') {   // 弹幕
          var n = e.phase === 2 ? 24 : 16, off = Math.random() * PI2;
          for (i = 0; i < n; i++) {
            var a = off + i / n * PI2;
            G.eprojs.push({ x: e.x, y: e.y, vx: cos(a) * 190, vy: sin(a) * 190, dmg: 10 * dmgR, r: 8, life: C.BOSS_BULLET_LIFE, boss: true, dt: e.def.dtype, el: e.elem });
          }
          ring(G, e.x, e.y, 90, e.def.color, 0.4);
          e.bt = cd;
        } else {                                       // 召唤小弟（属于这个洞府，洞府被镇灭时一起消散）
          banner(G, name + '召唤了小妖！', 2);
          for (var s = 0; s < 8 + (e.phase === 2 ? 4 : 0) && G.enemies.length < C.MAX_ENEMIES; s++) {
            var aa = s / 8 * PI2; makeEnemy(G, s % 4 === 0 ? e.def.summon : 'small', e.x + cos(aa) * 110, e.y + sin(aa) * 110, e.den);
          }
          ring(G, e.x, e.y, 120, e.def.color, 0.4);
          e.bt = cd;
        }
      }
    } else if (e.bstate === 'slam') {
      if (e.bt <= 0) {
        ring(G, e.x, e.y, e.slamR, '#ff7a3c', 0.5, true); G.shake = Math.max(G.shake, 8);
        for (i = 0; i < G.heroes.length; i++) {
          hh0 = G.heroes[i]; if (hh0.down) continue;
          if (XY.dist(e.x, e.y, hh0.x, hh0.y) < e.slamR + hh0.def.r) hurtHeroBy(G, hh0, 26 * dmgR, false, name + '的震地波及了师父', e.def.dtype, e.elem);
        }
        G.towers.forEach(function (t) { if (XY.dist(e.x, e.y, t.x, t.y) < e.slamR) hurtTower(G, t, 40 * dmgR); });
        e.bstate = 'idle'; e.bt = cd;
      }
    } else if (e.bstate === 'tele') {
      if (e.bt <= 0) { e.bstate = 'charge'; e.bt = 0.75; e.hitHeroes = {}; }
    } else if (e.bstate === 'charge') {
      mvx = e.cdx; mvy = e.cdy; sp = 540;
      for (var j = 0; j < G.heroes.length; j++) {                    // 冲锋撞到的英雄吃一大口
        var h = G.heroes[j]; if (h.down || e.hitHeroes[j]) continue;
        if (XY.dist(e.x, e.y, h.x, h.y) < e.r + h.def.r) {
          e.hitHeroes[j] = true; hurtHeroBy(G, h, 30 * dmgR, false, name + '的冲锋撞倒了师父', e.def.dtype, e.elem);
          if (j !== 0) {                               // 冲锋撞上挡路的英雄：被拦住并晕一会儿（这就是“守护师傅”的用处）
            e.bstate = 'idle'; e.bt = cd + 0.8; e.stunT = 1.4; e.flash = 0.2; ring(G, e.x, e.y, 90, '#ffd34d', 0.45, true); G.shake = Math.max(G.shake, 6);
            toast(G, h.def.name + ' 拦住了' + name + '的冲锋！'); break;
          }
        }
      }
      if (e.bt <= 0) { e.bstate = 'idle'; e.bt = cd; }
    }
    e.x = clamp(e.x + mvx * sp * dt, e.r, C.WORLD_W - e.r);
    e.y = clamp(e.y + mvy * sp * dt, e.r, C.WORLD_H - e.r);
    bossKeepAway(G, e);
    // 身体接触
    e.atkT -= dt;
    if (e.atkT <= 0) {
      for (var q = 0; q < G.heroes.length; q++) {
        var hh = G.heroes[q]; if (hh.down) continue;
        if (XY.dist(e.x, e.y, hh.x, hh.y) < e.r + hh.def.r) { hurtHeroBy(G, hh, e.dmg, true, hh.id === 'tang' ? name + '碰到了师父' : undefined, e.def.dtype, e.elem); e.atkT = 0.8; break; }
      }
      var cc = G.camp;
      if (cc.active && XY.dist(e.x, e.y, cc.x, cc.y) < e.r + cc.r) { hurtCamp(G, e.dmg); e.atkT = 0.8; }
    }
  }

  /* ================= 防御塔 ================= */
  XY.towerStat = function (G, t) {
    var d = XY.TOWERS[t.type], m = 1 + 0.5 * (t.lv - 1);
    return { dmg: d.dmg * m * G.P.tower, range: d.range * (1 + 0.1 * (t.lv - 1)), cd: d.cd * (t.lv === 3 ? 0.85 : 1) };
  };

  function mkTowerObj(type, x, y) {
    var hp = XY.TOWER_HP[type];
    return { x: x, y: y, type: type, lv: 1, cd: 0.5, ang: 0, pulse: 0, hp: hp, maxHp: hp, upT: 0, bornT: 0.6, hurtT: 0 };
  }
  XY.towerMaxHp = function (t) { return XY.TOWER_HP[t.type] * (1 + 0.5 * (t.lv - 1)); };

  // 塔受伤（只有妖塔 / 洞府 BOSS 的震地能伤到）。塔永远不能收回，被打爆是它唯一消失的方式
  function hurtTower(G, t, dmg) {
    if (G.godMode) return;
    t.hp -= dmg; t.hurtT = 0.25;
    text(G, t.x, t.y - 30, Math.round(dmg), 'hurt');
    if (t.hp <= 0) {
      var k = G.towers.indexOf(t); if (k >= 0) G.towers.splice(k, 1);
      t.dead = true; G.stats.towersLost++;
      ring(G, t.x, t.y, 60, '#777', 0.5, true); spark(G, t.x, t.y, '#8a6a4a', 12);
      toast(G, XY.TOWERS[t.type].name + '战死了！');
    }
  }
  XY.hurtTower = hurtTower;

  function updateTowers(G, dt) {
    for (var i = 0; i < G.towers.length; i++) {
      var t = G.towers[i], d = XY.TOWERS[t.type], s = XY.towerStat(G, t);
      if (t.hurtT > 0) t.hurtT -= dt;
      if (t.upT > 0) t.upT -= dt;
      if (t.bornT > 0) t.bornT -= dt;
      if (t.atkT > 0) t.atkT -= dt;                    // 出手动作计时（画面用）
      t.cd -= dt;
      if (t.cd > 0) continue;
      if (t.type === 'heal') {                         // 佛光塔：每 1.5 秒脉冲一次，给范围内的徒弟 / 营地 / 友塔回血
        t.cd = s.cd; var healed = false, j;
        for (j = 1; j < G.heroes.length; j++) {
          var hj = G.heroes[j]; if (hj.down) continue;
          if (XY.dist(hj.x, hj.y, t.x, t.y) <= s.range && hj.hp < hj.maxHp) { healHero(G, hj, hj.maxHp * d.heal * (1 + 0.3 * (t.lv - 1)), true); healed = true; }
        }
        if (G.camp.active && XY.dist(G.camp.x, G.camp.y, t.x, t.y) <= s.range + G.camp.r && G.camp.hp < G.camp.maxHp) { G.camp.hp = Math.min(G.camp.maxHp, G.camp.hp + 8 * t.lv); healed = true; }
        for (j = 0; j < G.towers.length; j++) {
          var o = G.towers[j]; if (o === t) continue;
          var mh = XY.towerMaxHp(o);
          if (o.hp < mh && XY.dist(o.x, o.y, t.x, t.y) <= s.range) { o.hp = Math.min(mh, o.hp + mh * 0.1); healed = true; }
        }
        if (healed) { t.pulse = 0.5; t.atkT = 0.3; ring(G, t.x, t.y, s.range, '#f2c14e', 0.5); }
        continue;
      }
      if (t.type === 'frost') {
        t.cd = s.cd; var any = false;
        G.grid.query(t.x, t.y, s.range, function (e) {
          any = true; e.slowT = Math.max(e.slowT, 0.9); e.slowF = Math.max(e.slowF, d.slow * (e.def.boss ? 0.5 : 1));
          hurtEnemy(G, e, s.dmg, { dot: true, type: 'magic', elem: 'water' });
        });
        if (any) { t.pulse = 0.4; t.atkT = 0.3; }
        continue;
      }
      var tgt = null;
      if (t.type === 'siege') {                         // 破阵弩：优先点射程内的妖塔
        var bd = Infinity;
        G.grid.query(t.x, t.y, s.range, function (e) { if (e.def.etower) { var dd = XY.dist(e.x, e.y, t.x, t.y); if (dd < bd) { bd = dd; tgt = e; } } });
      }
      if (!tgt) tgt = (G.threat && !G.threat.dead && XY.dist(G.threat.x, G.threat.y, t.x, t.y) <= s.range && XY.dist(G.threat.x, G.threat.y, G.heroes[0].x, G.heroes[0].y) < C.CAMP_ZONE_R + 40) ? G.threat : G.grid.nearest(t.x, t.y, s.range);   // 营地圈里的妖怪优先
      if (!tgt) { t.cd = 0.1; continue; }
      var a = atan2(tgt.y - t.y, tgt.x - t.x);
      t.ang = a; t.atkT = 0.3;
      if (t.type === 'arrow') {
        G.projs.push({ x: t.x, y: t.y - 14, vx: cos(a) * 560, vy: sin(a) * 560, dmg: s.dmg, r: 5, life: 0.9, pierce: 0, hits: [], kind: 'arrow', src: null });
      } else if (t.type === 'siege') {
        G.projs.push({ x: t.x, y: t.y - 14, vx: cos(a) * 700, vy: sin(a) * 700, dmg: s.dmg, r: 8, life: s.range / 700 + 0.15, pierce: 1, hits: [], kind: 'bolt', anti: d.anti, src: null });
      } else {
        G.projs.push({ x: t.x, y: t.y - 14, vx: cos(a) * 380, vy: sin(a) * 380, dmg: s.dmg, r: 7, life: 1.2, pierce: 0, hits: [], kind: 'shell', splash: d.splash * (1 + 0.1 * (t.lv - 1)), src: null });
      }

  }

  // 造塔：点“造塔”按钮选塔型，再点地面（x,y 是世界坐标）；一路上都能造，只要离操控英雄 / 师父不太远（或在营地附近）
  XY.buildReach = function (G, x, y) {
    var c = G.heroes[G.ctrl], t = G.heroes[0];
    if (!c.down && XY.dist(x, y, c.x, c.y) <= C.BUILD_REACH) return true;
    if (!t.down && XY.dist(x, y, t.x, t.y) <= C.BUILD_REACH) return true;
    return XY.dist(x, y, t.x, t.y) <= C.TOWER_RANGE_FROM_CAMP;
  };
  XY.towerBlock = function (G, type, x, y) {
    var d = XY.TOWERS[type], camp = G.camp, i;
    if (G.towers.length >= (XY.soldierCap ? XY.soldierCap(G) : C.MAX_TOWERS)) return '塔已经满了';
    if (x < 40 || y < 40 || x > C.WORLD_W - 40 || y > C.WORLD_H - 40) return '地图边缘不能造塔';
    if (!XY.buildReach(G, x, y)) return '离队伍太远了：塔要造在操控英雄或师父身边 ' + C.BUILD_REACH + ' 以内（或营地附近）';
    if (camp.active && XY.dist(x, y, camp.x, camp.y) < camp.r + 34) return '这里是营地，点远一点的空地';
    for (i = 0; i < G.dens.length; i++) if (XY.dist(x, y, G.dens[i].x, G.dens[i].y) < C.DEN_NOBUILD) return '离洞府太近了，不能造塔';
    for (i = 0; i < G.towers.length; i++) if (XY.dist(x, y, G.towers[i].x, G.towers[i].y) < 50) return '这里太挤了，换个位置（点已有的塔可以升级）';
    if (G.coins < d.cost) return '金币不够：' + d.name + '要 ' + d.cost + ' 金币';
    return null;
  };
  XY.placeTower = function (G, type, x, y) {
    if (G.mode !== 'play') return false;
    var d = XY.TOWERS[type], h = G.heroes[G.ctrl];
    if (x === undefined) { if (h.down) return false; x = h.x + cos(h.face) * 38; y = h.y + sin(h.face) * 38; }
    var why = XY.towerBlock(G, type, x, y);
    if (why) { toast(G, why); return false; }
    G.coins -= d.cost;
    G.towers.push(mkTowerObj(type, x, y));
    ring(G, x, y, 40, d.color, 0.4, true);
    return true;
  };
  XY.towerAt = function (G, x, y, r) {
    var best = null, bd = r || 34;
    G.towers.forEach(function (t) { var d = XY.dist(x, y, t.x, t.y); if (d < bd) { bd = d; best = t; } });
    return best;
  };
  // 升级一座塔（点塔弹出的“升级”按钮）；不给塔时升级离当前英雄最近的（只给测试/模拟用）
  XY.upgradeTower = function (G, t) {
    if (G.mode !== 'play') return false;
    var h = G.heroes[G.ctrl];
    if (!t) t = XY.towerAt(G, h.x, h.y, 90);
    if (!t) { toast(G, '附近没有塔'); return false; }
    if (t.lv >= 3) { toast(G, '这座塔已经满级了'); return false; }
    var cost = XY.TOWER_UP_COST[t.lv + 1];
    if (G.coins < cost) { toast(G, '升级要 ' + cost + ' 金币'); return false; }
    G.coins -= cost; t.lv++;
    var mh = XY.towerMaxHp(t); t.hp = Math.min(mh, t.hp + mh * 0.35); t.maxHp = mh;
    t.upT = 1.0; if (t.lv === 3) G.stats.tower3 = true;
    ring(G, t.x, t.y, 70, '#ffd24a', 0.6, true); ring(G, t.x, t.y, 110, '#fff3b0', 0.8);
    spark(G, t.x, t.y, '#ffd24a', 14); G.shake = Math.max(G.shake, 3);
    text(G, t.x, t.y - 56, '升级 Lv' + t.lv, 'big');
    return true;
  };

  /* ================= 子弹 ================= */
  function updateProjs(G, dt) {
    var P = G.projs, i, w = 0;
    for (i = 0; i < P.length; i++) {
      var p = P[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      var alive = p.life > 0;
      if (alive) {
        G.grid.query(p.x, p.y, p.r, function (e) {
          if (!alive || p.hits.indexOf(e.id) >= 0) return;
          p.hits.push(e.id); p.hitAny = true;
          if (p.kind === 'shell') { alive = false; explode(G, p); return; }
          if (p.anti && e.def.etower) { var amul = p.anti; hurtEnemy(G, e, p.dmg * amul, { src: p.src, kb: 0, fx: p.x, fy: p.y }); if (p.pierce-- <= 0) alive = false; return; }
          hurtEnemy(G, e, p.dmg, { src: p.src, kb: p.kind === 'water' ? 90 : 40, fx: p.x - p.vx, fy: p.y - p.vy, crit: p.crit, type: p.dtype, elem: p.elem });
          if (p.onHit) p.onHit(G, e, p);                   // v0.5：12 位常驻角色的独有效果（藤蔓缠绕 / 拉钩 / 标记 …）
          if (p.pierce-- <= 0) alive = false;
        });
      } else if (p.kind === 'shell') explode(G, p);
      else if (p.trk && !p.hitAny && p.src) XY.spsupMiss(G, p.src);
      if (alive) P[w++] = p;
    }
    P.length = w;

    // 敌人的子弹：打英雄和营地
    var EP = G.eprojs; w = 0;
    for (i = 0; i < EP.length; i++) {
      var q = EP[i], alive2 = true;
      q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
      if (q.life <= 0) alive2 = false;
      for (var j = 0; j < G.heroes.length && alive2; j++) {
        var h = G.heroes[j]; if (h.down) continue;
        var dx = h.x - q.x, dy = h.y - q.y, rr = h.def.r + q.r;
        if (dx * dx + dy * dy < rr * rr) { G._src = q.src === 'etower' ? 'etower' : 'proj'; hurtHeroBy(G, h, q.dmg, false, undefined, q.dt, q.el); G._src = null; alive2 = false; }
      }

        }

      if (alive2 && G.camp.active && XY.dist(q.x, q.y, G.camp.x, G.camp.y) < G.camp.r + q.r) { hurtCamp(G, q.dmg * 0.6); alive2 = false; }
      if (alive2) EP[w++] = q;
    }
    EP.length = w;
  }

  function explode(G, p) {
    ring(G, p.x, p.y, p.splash, '#ff9a3c', 0.3, true);
    G.grid.query(p.x, p.y, p.splash, function (e) { hurtEnemy(G, e, p.dmg, { kb: 160, fx: p.x, fy: p.y }); });
  }

  /* ================= 地面区域（流沙河） ================= */
  function updateZones(G, dt) {
    var Z = G.zones, w = 0;

      var z = Z[i]; z.t -= dt; z.tick -= dt;
      if (z.follow) { var fh = G.heroes[0]; if (fh.down) z.t = 0; else { z.x = fh.x; z.y = fh.y; } }
      if (z.kind === 'sand') {                           // 流沙护法：圈内的妖怪暗器直接消失
        for (var pi = G.eprojs.length - 1; pi >= 0; pi--) {
          var ep = G.eprojs[pi];

        }
      }
      if (z.tick <= 0) {
        z.tick = 0.25;
        G.grid.query(z.x, z.y, z.r, function (e) {
          e.slowT = Math.max(e.slowT, 0.5); e.slowF = Math.max(e.slowF, z.kind === 'sand' ? (e.def.boss ? 0.5 : 0.8) : (e.def.boss ? 0.3 : 0.65));
          hurtEnemy(G, e, z.dmg * 0.25, { dot: true, src: z.owner });
        });
      }
      if (z.t > 0) Z[w++] = z;
    }
    Z.length = w;
  }

  /* ================= 经验 / 金币拾取 ================= */
  function updatePickups(G, dt) {
    var pr = G.P.pick;
    pull(G.gems, function (g) { addXp(G, g.v, g.mag); }, C.DROP_CAP_GEM);
    pull(G.coinDrops, function (c) { G.coins += c.v; G.coinAcc = (G.coinAcc || 0) + c.v; if (G.t - (G.coinTxT === undefined ? -9 : G.coinTxT) > 0.3) { text(G, c.x, c.y - 8, '+' + G.coinAcc, 'coin'); G.coinAcc = 0; G.coinTxT = G.t; } }, C.DROP_CAP_COIN);
    function pull(arr, onGet, cap) {
      var w = 0, over = arr.length - cap;                 // 超过上限：最老的（数组前面的）、还没被吸走的先没
      for (var i = 0; i < arr.length; i++) {
        var g = arr[i], keep = true;
        if (!g.mag) {
          if (over > 0) { over--; G.stats.dropCapped = (G.stats.dropCapped || 0) + 1; continue; }
          g.age = (g.age || 0) + dt;                      // 地上的经验 / 金币会慢慢消失（被吸走的不计时）
          if (g.age >= C.DROP_LIFE) { G.stats.dropExpired = (G.stats.dropExpired || 0) + 1; continue; }
          for (var j = 0; j < G.heroes.length; j++) {
            var h = G.heroes[j]; if (h.down) continue;
            var dx = h.x - g.x, dy = h.y - g.y;

          }
        }
        if (g.mag) {
          var m = g.mag; if (m.down) { g.mag = null; }
          else {
            var ddx = m.x - g.x, ddy = m.y - g.y, dd = sqrt(ddx * ddx + ddy * ddy) || 1;
            g.sp += 900 * dt;
            var st = Math.min(g.sp * dt, dd);
            g.x += ddx / dd * st; g.y += ddy / dd * st;
            if (dd < m.def.r + 6) { onGet(g); keep = false; if (XY.anim) XY.anim.pickup(G, m); if (XY.sfx) XY.sfx(arr === G.gems ? 'gem' : 'coin'); }
          }
        }
        if (keep) arr[w++] = g;
      }
      arr.length = w;
    }
  }

  /* ================= 升级 → 技能点 ================= */
  XY.xpNeed = function (L) { return Math.round(Math.min(C.XP_NEED_MAX, 5 + 2.2 * Math.pow(L, 1.6))); };

  // 升级不再暂停游戏：给技能点，玩家随时按 Tab 打开技能树去花

  function addXp(G, v, who) {

    G.xp += v * G.P.xp;

      gainPoints(G, 1 + (G.level % C.POINT_BONUS_EVERY === 0 ? 1 : 0), who);
      need = XY.xpNeed(G.level);
    }
    if (G.level >= C.LEVEL_CAP) { G.xp = 0; banner(G, '满级 99！', 3); }
  }
  XY.addXp = addXp;

  // 打开 / 关闭技能树（打开时游戏暂停）
  XY.toggleSkills = function (G, on) {
    if (on === undefined) on = G.mode !== 'skills';
    if (on && G.mode === 'play') G.mode = 'skills';
    else if (!on && G.mode === 'skills') G.mode = 'play';
    return G.mode === 'skills';
  };

  /* ================= 特效 / 飘字 动画更新 ================= */
  function updateFx(G, dt) {
    var w = 0, i;
    for (i = 0; i < G.fx.length; i++) { var f = G.fx[i]; f.t += dt; if (f.t < f.max) G.fx[w++] = f; }
    G.fx.length = w; w = 0;
    for (i = 0; i < G.texts.length; i++) { var t = G.texts[i]; t.t += dt; t.y += t.vy * dt; t.vy *= 0.94; if (t.t < t.max) G.texts[w++] = t; }

    for (i = 0; i < G.towers.length; i++) if (G.towers[i].pulse > 0) G.towers[i].pulse -= dt;
  }

  /* ================= 调试辅助 ================= */
  XY.debug = {
    skip60: function (G) { XY.skipTo(G, G.t + 60); },
    levelUp: function (G) { G.level++; gainPoints(G, 1); },
    points: function (G, n) { gainPoints(G, n || 5); },
    coins: function (G) { G.coins += 100; },
    god: function (G) { G.godMode = !G.godMode; toast(G, G.godMode ? '无敌：开' : '无敌：关'); },
    spawn: function (G, n, type, x, y, den) {   // 压力测试：在镜头周围（或指定位置）刷 n 只敌人
      for (var i = 0; i < n; i++) { var p = x === undefined ? spawnPos(G) : { x: x + rand(-40, 40), y: y + rand(-40, 40) }; makeEnemy(G, type || pickType(G.t), p.x, p.y, den); }
    },
    hurtHero: function (G, i, d) { hurtHero(G, G.heroes[i], d); },

    tangTo: function (G, s, phase) { G.tang.s = Math.max(0, Math.min(G.rt.total, s)); if (phase) G.tang.phase = phase; var p = XY.routeAt(G.rt, G.tang.s); G.heroes[0].x = p.x; G.heroes[0].y = p.y; },
    tangRest: function (G) { XY.debug.tangTo(G, G.rt.restS - 1, 'walk'); },
    toRest: function (G) { XY.debug.tangTo(G, G.rt.restS, 'rest'); G.tang.restT = 0; G.camp.active = true; G.station = true; },   // 测试：直接进入休息阶段（营地规则生效）
    freezeTang: function (G) { G.tang.speed = 0; },
    clearLevel: function (G) { XY.debug.killAllBosses(G); XY.debug.completeMain(G); XY.debug.tpGate(G); }
  };
  XY.core = { hurtEnemy: hurtEnemy, killEnemy: killEnemy, healHero: healHero, hurtHero: hurtHero, text: text, spark: spark, ring: ring, banner: banner, toast: toast, makeEnemy: makeEnemy, heroDmg: heroDmg, spawnPos: spawnPos, pickType: pickType, mkTower: mkTowerObj, castUlt: castUlt };
})();

<script>
/* ---- js/elem.js ---- */
/* ============================================================
 * elem.js —— 五行相克特效 + 精英元素护盾（v0.5 第 2 批）
 *
 * 五行（只有这五种）：金 木 水 火 土。相克：金克木、木克土、土克水、水克火、火克金；相生：金生水、水生木、木生火、火生土、土生金。
 * 倍率（XY.C）：克制 ELEM_WIN=1.35、被克 ELEM_LOSE=0.75、同属性 ELEM_SAME=0.85、其他 1.0。每个技能的元素见 XY.skillElem。
 * 特效：命中时飘「克 ×1.35」（技能元素的颜色）+ 一个元素字的光环爆发；被克飘灰色「被克 ×0.75」。LOD：每 0.1 秒最多 3 处、每个怪 0.45 秒一次。
 * 精英护盾：精英出生带「最大生命 25%」的元素护盾，先打破护盾才伤到血；克制它的元素破盾更快（×1.5）。
 * ============================================================ */
(function () {
  var XY = window.XY, C = XY.C;

  XY.elemFx = function (G, e, el, em) {
    if (!(em > 1.05 || em < 0.8)) return;
    if (G.t < (e.ctT || 0)) return;
    var st = Math.floor(G.t * 10); if (G._ctS !== st) { G._ctS = st; G._ctN = 0; }
    if (++G._ctN > 3) return;
    e.ctT = G.t + 0.45;
    var E = XY.ELEMS[el]; if (!E) return;
    var K = XY.core;
    G.stats.elemWin = G.stats.elemWin || 0; G.stats.elemLose = G.stats.elemLose || 0;
    if (em > 1.05) {
      G.stats.elemWin++;
      K.text(G, e.x, e.y - e.r - 26, E.glyph + '克 ×' + em.toFixed(2), 'counter', E.color);
      if (!G._lod) { G.fx.push({ type: 'elemBurst', x: e.x, y: e.y, r: e.r + 34, color: E.color, glyph: E.glyph, t: 0, max: 0.55 }); K.spark(G, e.x, e.y, E.color, 7); }
      G.shake = Math.max(G.shake, 1.5);
    } else {
      G.stats.elemLose++;
      K.text(G, e.x, e.y - e.r - 20, '被克 ×' + em.toFixed(2), 'beaten', '#8a8576');
    }
  };

  /* ---------- 精英元素护盾 ---------- */
  XY.SHIELD_FRAC = 0.25; XY.SHIELD_COUNTER = 1.5;
  XY.shieldInit = function (e) { e.shieldMax = e.shield = Math.round(e.maxHp * XY.SHIELD_FRAC); e.shieldElem = e.elem || null; };
  XY.shieldHit = function (G, e, dmg, em, el) {
    var mult = em > 1.05 ? XY.SHIELD_COUNTER : 1, sd = dmg * mult, K = XY.core;
    if (sd < e.shield) { e.shield -= sd; if (Math.random() < 0.35) K.text(G, e.x, e.y - e.r - 6, Math.round(dmg), 'shield', '#4a90d9'); return 0; }
    var rest = (sd - e.shield) / mult; e.shield = 0;
    var col = (XY.ELEMS[e.shieldElem] || {}).color || '#6fa8dc';
    K.text(G, e.x, e.y - e.r - 24, '破盾！', 'counter', col);
    G.fx.push({ type: 'ring', x: e.x, y: e.y, r: e.r + 46, color: col, t: 0, max: 0.5, fill: true }); K.spark(G, e.x, e.y, col, 10);
    G.shake = Math.max(G.shake, 3); G.stats.shieldBreaks = (G.stats.shieldBreaks || 0) + 1;
    return rest;
  };

  /* ---------- 每个技能的元素（文档 + 测试的“预期值”表）----------
   * kind: 'atk' 普攻 / 'ult' 大招 / 'trait' 特性 / 辅助技能 id。没有登记的技能随使用者本身的元素。 */
  XY.SKILL_ELEM = { fire: 'fire', chill: 'water', boom: 'fire', leech: 'metal', vital: 'wood', swift: 'wood' };
  XY.skillElem = function (h, kind) {
    if (XY.SKILL_ELEM[kind]) return XY.SKILL_ELEM[kind];
    return (h && h.def && h.def.elem) || null;
  };

<script>
/* ---- js/abilities.js ---- */
/* ============================================================

(function () {

  // 追剿令（v0.4.1）：拖得太久（不管有没有洞府活着）就会有越来越强的精英追兵从远处杀向营地

      var x = clamp(bp.x + back + rand(-120, 120), 40, C.WORLD_W - 40), y = clamp(bp.y + rand(-160, 160), 40, C.WORLD_H - 40);

      if (j % 2 === 0) { h.hp *= C.HUNT_HP * (1 + C.HUNT_HP_UP * k); h.maxHp = h.hp; h.dmg *= C.HUNT_DMG * (1 + C.HUNT_DMG_UP * k); }

  // 路边刷怪点（v0.5）：洞府离西行路远，光靠洞府怪太少。唐僧前方 600–900 路程处，每 ~15 秒冒出 8–14 只（越往后越多、休息时 ×出量倍率）
  function updateRoadside(G, dt) {
    if (G.tang.phase === 'arrived' || G.ending) return;
    G.roadT = (G.roadT === undefined ? 6 : G.roadT) - dt;
    if (G.roadT > 0) return;

    var s0 = G.tang.s + rand(C.ROAD_AHEAD0, C.ROAD_AHEAD1); if (s0 > G.rt.total - 80) return;
    var n = Math.round(rand(C.ROAD_N0, C.ROAD_N1) * (1 + 0.15 * Math.min(G.t / 60, 6)) * Math.min(1.6, 0.8 + 0.3 * G.lv.mul));
    var bp = XY.routeAt(G.rt, s0), nx = -Math.sin(bp.a), ny = Math.cos(bp.a);
    for (var j = 0; j < n && G.enemies.length < C.MAX_ENEMIES - 40; j++) {
      var off = rand(-C.ROAD_HALF * 0.9, C.ROAD_HALF * 0.9), al = rand(-90, 90);
      var x = clamp(bp.x + nx * off + Math.cos(bp.a) * al, 40, C.WORLD_W - 40), y = clamp(bp.y + ny * off + Math.sin(bp.a) * al, 40, C.WORLD_H - 40);
      var e = K.makeEnemy(G, j % 5 === 4 ? 'ranged' : (j % 9 === 8 ? 'tank' : 'small'), x, y, null); e.road = true;

  }


  // 密度控制器（v0.5 爽快样板）：以唐僧为中心，按“目标同屏数”把怪从镜头外围补进来（75–85% 脆皮小怪），
  // 每隔一阵来一波浪潮（拉高峰值）。休息守营阶段（围攻）目标更高。目标值：行军 40–60、峰值 120–180；围攻 85–140、峰值 220–300。
  XY.densityTarget = function (G) {
    var min = G.t / 60, rest = G.tang.phase === 'rest', lm = G.lv.mul;
    var base = rest ? C.FLOW_REST : C.FLOW_WALK;
    return Math.round(base * Math.min(1.0 + 0.06 * min, 1.45) * (0.9 + 0.1 * lm) * (G.t < 60 ? 1.1 : 1));
  };
  function updateFlow(G, dt) {
    if (G.tang.phase === 'arrived' || G.ending) return;
    var tg = G.heroes[0], ctrl = G.heroes[G.ctrl] || tg;
    G.flowT = (G.flowT === undefined ? 1.2 : G.flowT) - dt;
    G.surgeT = G.surgeT === undefined ? C.SURGE_FIRST : G.surgeT - dt;

    var foci = [{ x: tg.x, y: tg.y, k: 1, near: 0 }];
    if (!ctrl.down && ctrl !== tg && dist(ctrl.x, ctrl.y, tg.x, tg.y) > R * 0.8) foci.push({ x: ctrl.x, y: ctrl.y, k: 0.8, near: 0 });   // 操控英雄跑远了（去打洞府）：他身边也要有怪可打
    for (i = 0; i < G.enemies.length; i++) {
      e = G.enemies[i]; if (e.dead || e.hunter) continue;
      for (var f = 0; f < foci.length; f++) { var dx = e.x - foci[f].x, dy = e.y - foci[f].y; if (dx * dx + dy * dy < R * R) foci[f].near++; }
      if (e.x >= vr.x0 && e.x <= vr.x1 && e.y >= vr.y0 && e.y <= vr.y1) vis++;
    }
    var st = G.stats; st.visSum = (st.visSum || 0) + vis; st.visCnt = (st.visCnt || 0) + 1; if (vis > (st.visMax || 0)) st.visMax = vis;
    if (G.noSpawn) return;
    var want = XY.densityTarget(G), surge = false;
    if (G.surgeT <= 0) { G.surgeT = C.SURGE_EVERY * rand(0.8, 1.2) * (rest ? 0.75 : 1); surge = true; st.surges = (st.surges || 0) + 1; }
    var fp = XY.routeAt(G.rt, Math.min(G.rt.total, G.tang.s + 500)), fa = Math.atan2(fp.y - tg.y, fp.x - tg.x);
    for (var q0 = 0; q0 < foci.length; q0++) {
      var F = foci[q0], n = surge ? Math.round(want * F.k * rand(C.SURGE_K0, C.SURGE_K1)) : Math.min(C.FLOW_BATCH, Math.ceil((want * F.k - F.near) * 0.35));
      for (var j = 0; j < n && G.enemies.length < C.MAX_ENEMIES - 30; j++) {
        var a = (q0 === 0 && Math.random() < 0.6) ? fa + rand(-1.1, 1.1) : rand(0, PI2), r = rand(R * 0.78, R * 1.08);
        var x = clamp(F.x + cos(a) * r, 40, C.WORLD_W - 40), y = clamp(F.y + sin(a) * r * 0.75, 40, C.WORLD_H - 40);
        var q = Math.random(), type = q < 0.80 ? 'small' : (q < 0.93 ? 'ranged' : 'tank');
        if (G.t < 45 && type === 'tank') type = 'small';
        var en = K.makeEnemy(G, type, x, y, null); en.road = true; en.flow = true; en.xpM = C.FLOW_XP; en.coinM = C.FLOW_COIN; if (rest) en.toCamp = true;
      }
    }

  }
  function rest0(G) { return G.tang.phase === 'rest'; }

  XY.updateDens = function (G, dt) {

    if (!G.noSpawn) { updateHunt(G, dt); updateRoadside(G, dt); updateFlow(G, dt); }      // G.noSpawn：测试开关，关掉一切刷怪（洞府 / 路边 / 追剿）
    for (i = 0; i < cnt.length; i++) cnt[i] = 0;
    for (i = 0; i < G.enemies.length; i++) {
      e = G.enemies[i];
      if (!e.dead && e.den != null && !e.def.denBoss && !e.def.etower) cnt[e.den]++;
    }
    var tg0 = G.heroes[0];
    G.dens.forEach(function (den) {
      if (den.closedT > 0) { den.closedT -= dt; return; }                 // 洞主败退后：暂时闭门
      var hb = den.boss;                                                    // 洞主躲在洞里（败退过、还活着、没出来）：洞府不出怪，等英雄靠近把他引出来
      if (den.beaten && hb && !hb.dead && (hb.hidden || hb.retreatT > 0 || (!hb.engaged && hb.home && dist(hb.x, hb.y, hb.home.x, hb.home.y) < 60))) return;
      if (dist(den.x, den.y, tg0.x, tg0.y) > C.DEN_ACTIVE) return;        // 唐僧走远了：洞府安静下来
      if (G.noSpawn) return;
      var bs = den.boss;                                                    // 引出洞主：BOSS 已被引到离洞口 DEN_DRAW_R 以外 → 洞里暂停一切刷怪，让你在外面单挑
      den.drawn = !!(bs && !bs.dead && bs.engaged && bs.home && !(bs.retreatT > 0) && dist(bs.x, bs.y, bs.home.x, bs.home.y) > C.DEN_DRAW_R);
      if (den.drawn) { if (!den._drawToast) { den._drawToast = true; XY.toast(G, den.name + ' 的洞主被引出洞了，洞里暂停出怪——在外面解决他！'); } return; }
      den._drawToast = false;
      den.cnt = cnt[den.i];

      }

      if (den.swarmT <= 0) {
        den.swarmT = C.DEN_SWARM_EVERY;
        var n = Math.round((12 + 3 * min) * G.lv.mul * C.SWARM_MUL), spawned = 0;
        for (var k = 0; k < n && G.enemies.length < C.MAX_ENEMIES && cnt[den.i] < C.DEN_CAP; k++) {
          var q = den_pos(den, 80, 220);
          K.makeEnemy(G, (k % 5 === 0 && G.t > 120) ? 'tank' : 'small', q.x, q.y, den.i); cnt[den.i]++; spawned++;

      den.raidT -= dt;
      if (den.raidT <= 0 && den.boss && !den.boss.dead && !(den.boss.retreatT > 0) && dist(den.x, den.y, tg0.x, tg0.y) < C.DEN_ACTIVE * 0.75) {

          rb.maxHp *= 1 + C.RAID_RAGE_HP; rb.hp = rb.maxHp; rb.baseHp *= 1 + C.RAID_RAGE_HP; rb.raidDmg = (rb.raidDmg || 1) * (1 + C.RAID_RAGE_DMG);
          var sn = Math.round((12 + 3 * min) * G.lv.mul * C.RAID_SWARM);
          for (var q3 = 0; q3 < sn && G.enemies.length < C.MAX_ENEMIES && cnt[den.i] < C.DEN_CAP; q3++) { var ps = den_pos(den, 90, 240); K.makeEnemy(G, (q3 % 5 === 0 && G.t > 120) ? 'tank' : 'small', ps.x, ps.y, den.i); cnt[den.i]++; }
          var esc = 1 + 2 * den.raids;
          for (var q2 = 0; q2 < esc && G.enemies.length < C.MAX_ENEMIES; q2++) { var pr = den_pos(den, 90, 180); K.makeEnemy(G, 'elite', pr.x, pr.y, den.i); }

  function ring_(G, x, y, r, c) { K.ring(G, x, y, r, c, 0.5); }

  /* ================= 出量倍率 M：驻守涨、不驻守降 ================= */
  XY.updateVolume = function (G, dt) {

  XY.updateGate = function (G, dt) {

  /* ================= 主动辅助技能（脉冲，每个都有 CD） ================= */
  function enemiesNear(G, x, y, r) { var n = 0; G.grid.query(x, y, r, function () { n++; }); return n; }
  var SUP_COND = {

    fire: function (G, h) { return enemiesNear(G, h.x, h.y, 240) >= 1; },
    chill: function (G, h) { return enemiesNear(G, h.x, h.y, 240) >= 1; },

      return false;

    wukong: function (G, h) { return enemiesNear(G, h.x, h.y, 150) >= 1; },
    bajie: function (G, h) { return h.hp < h.maxHp * 0.8; },
    wujing: function (G, h) { return enemiesNear(G, h.x, h.y, 160) >= 3 || h.hp < h.maxHp * 0.6; },
    horse: function (G, h) { return enemiesNear(G, h.x, h.y, 380) >= 2; }

  function fireSup(G, h, id, lv) {

    if (/^s[123]$/.test(id)) { XY.spsupFire(G, h, id, lv); return; }
    switch (id) {

      case 'chill':
        K.ring(G, h.x, h.y, 240, '#4aa3d6', 0.45, true);
        G.grid.query(h.x, h.y, 240, function (e) { e.slowT = Math.max(e.slowT, 3); e.slowF = Math.max(e.slowF, m.slowF * (e.def.boss ? 0.5 : 1)); });
        break;

<script>
/* ---- js/fx5.js ---- */
/* ============================================================

 *   XY.audio / XY.sfx(name, p)     程序合成音效：同时发声 ≤ 16 个节点，同类事件 30–60ms 内合并，不从渲染循环触发

<script>

/* ============================================================

<script>
/* ---- js/ride.js ---- */
/* ============================================================
 * ride.js —— v0.6 批次 3：白龙马骑乘（只有「跟随某人」这一条命令，没有任何上马 / 下马键）
 *   · 白龙马的命令多一档「骑乘」：点按钮 / Shift+5 轮流选目标（悟空→八戒→沙僧→特殊角色→回到跟随），唐僧永远不在候选里
 *   · 一次只能载一个人；换命令、换目标、骑手或白龙马倒下、你改去直接操控白龙马，都会自动下马
 *   · 骑乘时：白龙马不攻击、不放大招、不被妖怪盯上，贴在骑手脚下；骑手移速 ×1.35，攻击照旧
 * ============================================================ */
(function () {
  var XY = window.XY, C = XY.C;
  C.RIDE_SPEED = 1.35;
  XY.ORDER_NAME.ride = '骑乘'; XY.ORDER_SHORT.ride = '骑乘'; XY.ORDER_DESC.ride = '驮着选定的徒弟 / 特殊角色跑：他移速更快、攻击照旧；白龙马自己不攻击';
  function horse(G) { var h = G.heroes[4]; return h && h.id === 'horse' ? h : null; }
  XY.rideCands = function (G) {
    var out = [], hs = horse(G); if (!hs || hs.down) return out;
    for (var i = 1; i < G.heroes.length; i++) { if (i === 4) continue; var h = G.heroes[i]; if (h && !h.down) out.push(i); }
    return out;
  };
  function dismount(G, why) {
    var hs = horse(G); if (!hs) return;
    if (hs.ridden && G.heroes[hs.rideTgt]) G.heroes[hs.rideTgt].mounted = false;
    hs.ridden = false;
    if (why && hs.order === 'ride') { hs.order = 'follow'; }
    G.heroes.forEach(function (x) { x.mounted = false; });
    if (hs.rideTgt != null && why && XY.toast) XY.toast(G, '白龙马：' + why);
  }
  // 选骑乘对象（i = 英雄序号）。返回是否成功
  XY.rideSet = function (G, idx) {
    var hs = horse(G); if (!hs || hs.down) return false;
    if (idx === 0) { XY.toast(G, '唐僧不能骑，他自己赶路'); return false; }
    var t = G.heroes[idx]; if (!t || t.down || idx === 4) return false;
    G.heroes.forEach(function (x) { x.mounted = false; });
    hs.order = 'ride'; hs.rideTgt = idx; hs.retreat = false; hs.tgt = null;
    XY.toast(G, '白龙马：骑乘 ' + t.def.name + (G.ctrl === 4 ? '（你正在操控白龙马，改去操控别人后才会上马）' : ''));
    return true;
  };
  XY.rideCycle = function (G) {          // 在候选里轮流；最后一个之后回到「跟随」
    var hs = horse(G); if (!hs || hs.down) return false;
    var c = XY.rideCands(G); if (!c.length) return false;
    var k = hs.order === 'ride' ? c.indexOf(hs.rideTgt) : -1;
    if (hs.order === 'ride' && k >= c.length - 1) { return XY.setOrder(G, 4, 'follow'); }
    return XY.rideSet(G, c[k + 1]);
  };
  XY.rideTick = function (G) {
    var hs = horse(G); if (!hs) return;
    var t = hs.order === 'ride' ? G.heroes[hs.rideTgt] : null;
    if (!t) { if (hs.ridden) dismount(G, ''); hs.ridden = false; return; }
    if (hs.down || t.down || hs.rideTgt === 0 || hs.rideTgt === 4) { dismount(G, '骑手或白龙马倒下，已下马'); return; }
    if (G.ctrl === 4) { if (hs.ridden) dismount(G, ''); hs.ridden = false; return; }          // 你自己操控白龙马：它不驮人
    if (!hs.ridden) { hs.ridden = true; XY.core.ring(G, t.x, t.y, 54, '#6fcfd8', 0.4, true); }
    G.heroes.forEach(function (x) { x.mounted = false; }); t.mounted = true;
    if (XY.anim) XY.anim.rideFx(G, t);
  };
  XY.rideHorseStep = function (G, hs) {   // 每帧：白龙马贴在骑手脚下
    var t = G.heroes[hs.rideTgt]; hs.x = t.x; hs.y = t.y + 6; hs.face = t.face; hs.moving = t.moving; hs.inv = Math.max(hs.inv, 0.25); hs.dash = null; hs.atkT = Math.max(hs.atkT || 0, 0.2);
  };
  XY.rideName = function (G, hs) { var t = G.heroes[hs.rideTgt]; return t ? t.def.name : ''; };
  // 与 setOrder / cycleOrder 的衔接
  var oldSet = XY.setOrder, oldCycle = XY.cycleOrder;
  XY.setOrder = function (G, i, order) {
    if (order === 'ride') { if (i !== 4) return false; var c = XY.rideCands(G); return c.length ? XY.rideSet(G, c[0]) : false; }
    var h = G.heroes[i]; if (h && h.id === 'horse' && h.ridden) dismount(G, '');

  };
  XY.cycleOrder = function (G, i) {
    var h = G.heroes[i];
    if (h && h.id === 'horse' && !h.down) { if (h.order === 'ride') return XY.rideCycle(G); if (h.order === 'guard') return XY.rideSet(G, (XY.rideCands(G)[0])); }
    return oldCycle(G, i);
  };
})();

<script>
/* ---- js/sptree.js ---- */
/* ============================================================
 * sptree.js —— 技能树补全（v0.6 第 3 批）
 *   1) phyrex / laosiji / cato / heyuxi 四棵树原来只有 攻击 / 速度（+1 个召唤）三种节点类型，
 *      现在把每棵树的 4 个普通节点换成真正有效果的 辅助 / 控制 / 防御 / 经济 节点（带数值、会生效，不是只改颜色）。
 *   2) Phyrex 的树更长：根列下面多 3 个“专属强化”节点（可升 3 级）：币火强化 / 币环强化 / 变身续航。
 * 效果键（都有真实实现）：killHeal 击杀回血、regen 每秒回血、hitSlow 命中减速、coinUp 击杀额外金币概率、
 *   pickUp 全队拾取范围、hpAdd / dr 生命与减伤、pdef / mdef 物法防御；btcN / btcPierce / btcDmg / orbitN / tfDur / tfCd 见 phyrex.js
 * ============================================================ */
(function () {
  var XY = window.XY;
  var LAB = { hpAdd: function (v) { return '最大生命 +' + v; }, dr: function (v) { return '减伤 +' + Math.round(v * 100) + '%'; }, regen: function (v) { return '每秒回血 +' + v; },
    killHeal: function (v) { return '每次击杀回血 +' + v; }, hitSlow: function (v) { return '命中减速 ' + Math.round(v * 100) + '%（BOSS 减半）'; },
    coinUp: function (v) { return '击杀额外掉币概率 +' + Math.round(v * 100) + '%'; }, pickUp: function (v) { return '全队拾取范围 +' + Math.round(v * 100) + '%'; },
    pdef: function (v) { return '物防 +' + Math.round(v * 100) + '%'; }, mdef: function (v) { return '法防 +' + Math.round(v * 100) + '%'; },
    btcN: function (v) { return 'BTC 币数 +' + v; }, btcPierce: function (v) { return 'BTC 币穿透 +' + v; }, btcDmg: function (v) { return 'BTC 伤害 +' + Math.round(v * 100) + '%'; },
    orbitN: function (v) { return '环绕币 +' + v; }, tfDur: function (v) { return '变身时长 +' + Math.round(v * 8) + ' 秒'; }, tfCd: function (v) { return '变身冷却 -' + Math.round(v * 15) + ' 秒'; },
    dmg: function (v) { return '伤害 +' + Math.round(v * 100) + '%'; }, atkSpd: function (v) { return '攻击速度 +' + Math.round(v * 100) + '%'; } };
  function txt(fx) { return Object.keys(fx).map(function (k) { return LAB[k] ? LAB[k](fx[k]) : k; }).join('，'); }

  // 4 棵树的“类型补全节点”：[节点 id, 类型, 效果, {角色: 名字}]
  var RETYPE = [
    ['x2', 'aux', { killHeal: 3, regen: 0.4 }, { phyrex: '币息回流', laosiji: '热度回血', cato: '要素回春', heyuxi: '润喉回气' }],
    ['x4b', 'ctl', { hitSlow: 0.18 }, { phyrex: '币价冻结', laosiji: '堵车限速', cato: '冰封要点', heyuxi: '余音绕梁' }],
    ['y2', 'def', { hpAdd: 35, dr: 0.04 }, { phyrex: '冷钱包', laosiji: '安全头盔', cato: '深耕厚土', heyuxi: '咖啡护体' }],
    ['y4b', 'eco', { coinUp: 0.2, pickUp: 0.12 }, { phyrex: '币圈红利', laosiji: '过路费', cato: '丰收入账', heyuxi: '版税分成' }],
    ['z4b', 'def', { pdef: 0.06, mdef: 0.06 }, { phyrex: '风控护甲', laosiji: '防滑轮胎', cato: '稳固框架', heyuxi: '隔音棉' }],
    ['z3b', 'sum', { solDmg: 0.2, solLife: 0.2 }, { cato: '稻草人军团' }]          // 只有 Cato 缺“召唤”类型：这一条补上（强化已有天兵：伤害 +20%、生命 +20%；不加天兵上限——上限只属于沙僧，v0.5 测试要求）
  ];
  XY.TYPE_FIX_IDS = ['phyrex', 'laosiji', 'cato', 'heyuxi'];
  XY.TYPE_FIX_IDS.forEach(function (cid) {
    var tr = XY.TREE[cid]; if (!tr) return;
    RETYPE.forEach(function (r) {
      var n = tr.by[r[0]]; if (!n || !r[3][cid]) return;
      n.fx = JSON.parse(JSON.stringify(r[2])); n.ntype = r[1]; n.name = r[3][cid]; n.desc = [txt(n.fx)]; n.retyped = true;
    });
  });

  // Phyrex：3 个专属强化（可升 3 级；每级效果 = fx × 等级，见 skills.js computeMods 的 extra 分支）
  var EX = [
    { id: 'e1', name: '币火强化', ntype: 'atk', fx: { btcDmg: 0.12, btcN: 0.34, btcPierce: 0.34 } },
    { id: 'e2', name: '币环强化', ntype: 'atk', fx: { orbitN: 0.34, dmg: 0.04 } },

      desc: [1, 2, 3].map(function (l) { var f = {}; Object.keys(x.fx).forEach(function (k) { f[k] = Math.round(x.fx[k] * l * 1000) / 1000; }); return txt(f); }) };
    ph.nodes.push(n); ph.by[n.id] = n;

})();

<script>

/* soldiers.js —— v0.5 护法天兵：统一“塔”和“天兵降临”
 * 规则：
 *  · 天兵可以放在西行路两侧任意位置（不再限制离队伍多远）
 *  · 用“路线进度”（沿折线累计长度）判断前后：在唐僧身后的跟着走；在唐僧前面的原地驻守；唐僧走过之后驻守的就加入跟随
 *  · 所有天兵都会攻击、都会被打死；敌人的目标优先级统一：唐僧 / 徒弟 / 营地 > 天兵（天兵最低）
 *  · 天兵有“卡”（收集），不同种类效果和持续时间不同；和 12 位特殊角色是两套东西，也不用 X 性格
 */
(function () {
  var XY = window.XY, C = XY.C;

  /* ---------- 天兵卡：存档 ---------- */
  XY.SOLDIER_LV_AT = [1, 3, 6];                    // 张数达到 → 卡 Lv1 / Lv2 / Lv3

  function sdat() {

    if (!d.sold.cards) d.sold.cards = {};
