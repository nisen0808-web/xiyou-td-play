  }
  XY.solLevelOf = function (n) { var l = 0; XY.SOLDIER_LV_AT.forEach(function (a, i) { if (n >= a) l = i + 1; }); return l; };
  XY.save.solCards = function (t) { return sdat().cards[t] || 0; };
  XY.save.solLevel = function (t) {
    var l = XY.solLevelOf(XY.save.solCards(t));
    if (XY.TEST_BUILD) l = Math.max(l, 1);      // 测试版：所有天兵种类开局可用（至少 Lv1）
    return l;
  };
  XY.save.solOwned = function (t) { return XY.save.solLevel(t) >= 1; };
  XY.save.addSolCard = function (t, n) {
    var s = sdat(), before = XY.solLevelOf(s.cards[t] || 0);
    s.cards[t] = (s.cards[t] || 0) + (n || 1);
    var after = XY.solLevelOf(s.cards[t]); XY.save.touch();
    return { cards: s.cards[t], lv: after, up: after > before, first: before === 0 };
  };
  // 掉一张随机天兵卡（Boss 首次败退、宝箱）。越贵的越少。返回 { type, ... }
  XY.soldierCardDrop = function (G, x, y, why) {
    var w = { arrow: 4, heal: 3, frost: 3, cannon: 2.5, siege: 2 }, tot = 0, t, r;
    XY.TOWER_ORDER.forEach(function (k) { tot += w[k]; });
    r = Math.random() * tot; t = XY.TOWER_ORDER[0];
    for (var i = 0; i < XY.TOWER_ORDER.length; i++) { r -= w[XY.TOWER_ORDER[i]]; if (r <= 0) { t = XY.TOWER_ORDER[i]; break; } }
    var res = XY.save.addSolCard(t, 1);
    G.solDrops = (G.solDrops || []); G.solDrops.push(t);
    XY.toast(G, '获得天兵卡：' + XY.TOWERS[t].name + ' ×1（共 ' + res.cards + ' 张' + (res.first ? '，首次获得！' : (res.up ? '，升到 Lv' + res.lv : '')) + '）');
    XY.core.ring(G, x, y, 50, XY.TOWERS[t].color, 0.5, true);
    return { type: t, res: res, why: why };
  };

  /* ---------- 路线进度：前后判断 ---------- */
  XY.soldierRs = function (G, x, y) { return XY.routeProject(G.rt, x, y).s; };
  // 给天兵（塔或降临的天兵）定模式：在唐僧身后（含同一位置）→ follow；在前面 → garrison
  XY.soldierMode = function (G, u) {
    u.rs = XY.soldierRs(G, u.x, u.y);
    if (u.rs <= G.tang.s + 30) XY.soldierJoin(G, u); else { u.mode = 'garrison'; u.anchor = { x: u.x, y: u.y }; }
  };
  XY.soldierJoin = function (G, u) {
    u.mode = 'follow'; u.anchor = null;
    G.followSeq = (G.followSeq || 0) + 1; u.fslot = G.followSeq;
  };
  // 跟随队列里第 k 号的目标位置：在唐僧身后一段、左右错开
  XY.followSpot = function (G, k) {
    var back = C.SOLDIER_FOLLOW + (k % 6) * 36, side = (k % 2 ? 1 : -1) * (30 + Math.floor(k / 6) * 26);
    var p = XY.routeAt(G.rt, Math.max(0, G.tang.s - back)), nx = -Math.sin(p.a), ny = Math.cos(p.a);
    return { x: p.x + nx * side, y: p.y + ny * side };
  };
  // 每帧：驻守的天兵看唐僧是否走过自己；走过了就加入跟随
  XY.soldierTickMode = function (G, u) {
    if (u.mode === 'garrison' && G.tang.s > u.rs + 20) {
      XY.soldierJoin(G, u);
      XY.core.ring(G, u.x, u.y, 40, '#9fd0ff', 0.4);
    }
  };

  /* ---------- 统一：受伤 / 目标 ---------- */
  XY.hurtSoldier = function (G, u, dmg) { if (u.type) XY.hurtTower(G, u, dmg); else XY.hurtAlly(G, u, dmg); };
  XY.soldiersOf = function (G) { return G.towers.concat(G.allies.filter(function (a) { return !a.dead; })); };

  /* ---------- 塔 → 护法天兵：放置 / 寿命 / 移动 ---------- */
  var baseStat = XY.towerStat;
  XY.towerStat = function (G, t) {
    var s = baseStat(G, t), cl = t.cl || 1, m = 1 + 0.25 * (cl - 1);
    s.dmg *= m * XY.solMods(G).dmg; return s;
  };
  XY.towerMaxLife = function (t) { return XY.TOWERS[t.type].life * (1 + 0.3 * ((t.cl || 1) - 1)) * (t.lm || 1); };
  /* ---- 天兵上限与召唤加成（v0.5）：默认 6；只有沙僧的「召唤」分支能大幅提高；
   *      Phyrex / 园长两位召唤型特殊角色在场 +1；其他角色没有这类加成。
   *      「天兵降临」召来的临时天兵（G.allies，20 秒左右就散）单独计数，不占这 6 个名额。 */
  XY.SOL_SP_CAP = { phyrex: 1, yuanzhang: 1 };
  XY.solMods = function (G) {
    var o = { cap: C.MAX_TOWERS, dmg: 1, life: 1, cost: 1, sky: 0 }, f = 0, l = 0, c = 0, k = 0;
    G.heroes.forEach(function (h) {
      var m = h.mod; if (!m || h.down) return;
      o.cap += m.capAdd || 0; f += m.solDmg || 0; l += m.solLife || 0; c += m.solCost || 0; k += m.solSky || 0;
    });
    var sph = G.heroes[5]; if (G.special && XY.SOL_SP_CAP[G.special] && sph && !sph.down && sph.def.lv >= 3) o.cap += XY.SOL_SP_CAP[G.special];   // 角色卡升到 Lv3 才有（默认带 Phyrex 的新手仍是 6）
    o.dmg = 1 + f; o.life = 1 + l; o.cost = Math.max(0.4, 1 + c); o.sky = k; return o;
  };
  XY.soldierCap = function (G) { return XY.solMods(G).cap; };
  XY.buildReach = function (G, x, y) { return XY.onRoad(G, x, y); };
  XY.onRoad = function (G, x, y) { return XY.routeProject(G.rt, x, y).d <= C.ROAD_HALF; };
  XY.towerBlock = function (G, type, x, y) {
    var d = XY.TOWERS[type], camp = G.camp, i;
    if (!XY.save.solOwned(type)) return '还没有' + d.name + '的卡（打败 Boss / 开宝箱会掉天兵卡）';
    var cap = XY.soldierCap(G);
    if (G.towers.length >= cap) return '天兵已经满了（' + G.towers.length + '/' + cap + '；他们会累、也会战死，之后再叫新的' + (cap < 10 ? '；沙僧的「召唤」技能线能提高上限' : '') + '）';
    if (x < 40 || y < 40 || x > C.WORLD_W - 40 || y > C.WORLD_H - 40) return '地图边缘不能放天兵';
    if (!XY.onRoad(G, x, y)) return '天兵只能放在西行的路上（路两侧各 ' + C.ROAD_HALF + ' 以内）';
    if (camp.active && dist(x, y, camp.x, camp.y) < camp.r + 34) return '这里是营地，点远一点的空地';
    for (i = 0; i < G.dens.length; i++) if (dist(x, y, G.dens[i].x, G.dens[i].y) < C.DEN_NOBUILD) return '离洞府太近了，不能放天兵';
    for (i = 0; i < G.towers.length; i++) if (dist(x, y, G.towers[i].x, G.towers[i].y) < 40) return '这里太挤了，换个位置（点已有的天兵可以升级）';
    var need = Math.round(d.cost * XY.solMods(G).cost);      // 召唤折扣：价格、余额检查、扣款都用折后价
    if (G.coins < need) return '金币不够：' + d.name + '要 ' + need + ' 金币';
    return null;
  };
  var basePlace = XY.placeTower;
  XY.placeTower = function (G, type, x, y) {
    var n0 = G.towers.length, ok;
    if (x === undefined) {                                       // 不给坐标：放在操控英雄前方一点（取路上最近的点）
      var h = G.heroes[G.ctrl]; if (h.down) return false;
      x = h.x + Math.cos(h.face) * 38; y = h.y + Math.sin(h.face) * 38;
    }
    ok = basePlace(G, type, x, y);
    if (ok && G.towers.length > n0) {
      var t = G.towers[G.towers.length - 1];
      var sm = XY.solMods(G); G.coins += XY.TOWERS[type].cost - Math.round(XY.TOWERS[type].cost * sm.cost);      // 召唤花费折扣
      t.cl = Math.max(1, XY.save.solLevel(type)); t.lm = sm.life; t.maxLife = XY.towerMaxLife(t); t.life = t.maxLife; t.r = C.SOLDIER_R;
      XY.soldierMode(G, t);
      XY.toast(G, t.mode === 'follow' ? XY.TOWERS[type].name + '：跟在唐僧身后' : XY.TOWERS[type].name + '：在这里驻守，唐僧走过后会跟上');
    }
    return ok;
  };
  // v0.5：天兵不能升级，变强只靠收集天兵卡
  XY.upgradeTower = function (G) { XY.toast(G, '天兵不能升级：多收集天兵卡才会变强'); return false; };
  XY.initSoldiers = function (G) {                                // 开局两名弓天兵：跟在唐僧身后（代替原来的两座箭塔）
    for (var i = 0; i < 2; i++) {
      var t = XY.makeTower('arrow', G.heroes[0].x, G.heroes[0].y);
      t.cl = Math.max(1, XY.save.solLevel('arrow')); t.lm = XY.solMods(G).life; t.maxLife = XY.towerMaxLife(t); t.life = t.maxLife; t.r = C.SOLDIER_R; t.starter = true;
      t.rs = 0; XY.soldierJoin(G, t);
      var p = XY.followSpot(G, t.fslot); t.x = p.x; t.y = p.y;
      G.towers.push(t);
    }
  };

  // 每帧（在 updateTowers 之前）：寿命、前后模式、移动
  XY.updateSoldiers = function (G, dt) {
    var i, t, w = 0, spd = 240;
    for (i = 0; i < G.towers.length; i++) {
      t = G.towers[i];
      if (t.life === undefined) { t.cl = t.cl || 1; t.maxLife = XY.towerMaxLife(t); t.life = t.maxLife; t.r = C.SOLDIER_R; XY.soldierMode(G, t); }
      if (t.hp > 0) {
        t.life -= dt;
        if (t.life <= 0) {                                         // 时间到了：天兵撤走（不算战死）
          XY.core.ring(G, t.x, t.y, 36, '#cfe6ff', 0.5); XY.toast(G, XY.TOWERS[t.type].name + '时间到，回天上去了');
          G.stats.soldiersExpired = (G.stats.soldiersExpired || 0) + 1; continue;
        }
      }
      XY.soldierTickMode(G, t);
      if (t.mode === 'follow') {
        var p = XY.followSpot(G, t.fslot), dx = p.x - t.x, dy = p.y - t.y, l = Math.sqrt(dx * dx + dy * dy);
        if (l > 1200) { t.x = p.x; t.y = p.y; }
        else if (l > 3) { var st = Math.min(spd * dt * (l > 300 ? 1.8 : 1), l); t.x += dx / l * st; t.y += dy / l * st; }
      }
      G.towers[w++] = t;
    }
    G.towers.length = w;
  };
})();

</script>
<script>
/* ---- js/tutorial.js ---- */
(function () {
  'use strict';
  var XY = window.XY;
  /* ============ v0.6.3 新手教程（第一次玩自动出现；可跳过；主菜单可重看） ============
     一步一步、要玩家真的点一下才往下走；亮起真实的界面元素。
     教程期间：不刷怪、英雄无敌、时间和唐僧都停住（只是学操作，不会输），结束 / 跳过后全部还原。 */

  function app() { return XY.app || (window.__xy && window.__xy.app); }
  function touchUI() { var a = app(); return !!(a && (a.touchUI || a.touched)); }
  function alive(G, i) { var h = G.heroes[i]; return h && !h.down; }
  function firstAlive(G, list, notI) { for (var k = 0; k < list.length; k++) if (alive(G, list[k]) && list[k] !== notI) return list[k]; for (k = 1; k < G.heroes.length; k++) if (alive(G, k) && k !== notI) return k; return 1; }
  function pickIdx(G, tt) { if (tt.pick == null) tt.pick = firstAlive(G, [2, 3, 4, 1], G.ctrl); return tt.pick; }
  function cmdIdx(G, tt) { if (tt.cmd == null) tt.cmd = firstAlive(G, [3, 4, 1, 2], G.ctrl); return tt.cmd; }
  function nm(G, i) { var h = G.heroes[i]; return h ? h.def.name : '徒弟'; }
  function union(rs) {
    var u = null;
    rs.forEach(function (r) {
      if (!r) return;
      if (!u) u = { x: r.x, y: r.y, w: r.w, h: r.h };
      else { var x2 = Math.max(u.x + u.w, r.x + r.w), y2 = Math.max(u.y + u.h, r.y + r.h); u.x = Math.min(u.x, r.x); u.y = Math.min(u.y, r.y); u.w = x2 - u.x; u.h = y2 - u.y; }
    });
    return u;
  }
  function hitsWhere(pred) { return union(XY.ui.hits.filter(pred)); }
  var CAMP = { x: 12, y: 26, w: 214, h: 78 }, TANG = { x: 12, y: 110, w: 214, h: 50 }, REST = { x: 12, y: 166, w: 214, h: 44 };
  function midIfNarrow(G, a) { return a.lw < 1000 ? 'mid' : 'top'; }
  function cmdStep(order, title, text) {
    return {
      id: 'cmd_' + order, title: title,
      text: function (G, a, tt) { var i = cmdIdx(G, tt); return text.replace('{N}', nm(G, i)); },
      target: function (G, a, tt) { var i = cmdIdx(G, tt); return hitsWhere(function (h) { return h.act === 'order' && h.i === i && h.order === order; }); },
      allow: function (h, G, tt) { return h.act === 'order' && h.i === cmdIdx(G, tt) && h.order === order; },
      wait: function (G, tt) { var h = G.heroes[cmdIdx(G, tt)]; return !!h && h.order === order; }
    };
  }

  XY.TUT_STEPS = [
    { id: 'welcome', title: '欢迎取经！',
      text: function () { return '这位白衣和尚是唐僧师傅。他会自己一路向西走，你指挥不了他。他只有 1 点血，被妖怪一碰就输——你和徒弟们要一路护着他。\n（教程里时间是停的，也不会来怪，放心慢慢点。）'; },
      target: function () { return hitsWhere(function (h) { return h.act === 'hero' && h.i === 0; }); } },
    { id: 'choose', title: '第一步：选角色',
      text: function (G, a, tt) { var i = pickIdx(G, tt); return '下面这排卡片是你的队伍。点一下「' + nm(G, i) + '」的卡片，就能亲自操控他（被你操控的卡片会抬高、边框变粗）。' + (touchUI() ? '' : '\n键盘：数字键 1~6 也能换人。'); },
      target: function (G, a, tt) { var i = pickIdx(G, tt); return hitsWhere(function (h) { return h.act === 'hero' && h.i === i; }); },
      allow: function (h, G, tt) { return h.act === 'hero' && h.i === pickIdx(G, tt); },
      wait: function (G, tt) { return G.ctrl === pickIdx(G, tt); } },
    { id: 'move', title: '第二步：走一走',
      text: function () { return touchUI() ? '手指按住空白地面，往想去的方向拖，像摇杆一样；松手就停。轻点一下空地，他会自己走过去。试着走几步。' : '按 W A S D 走路，或者用鼠标点一下地面，他会自己走过去。试着走几步。'; },
      target: function (G, a) { var h = G.heroes[G.ctrl]; if (!h) return null; var x = h.x - G.cam.x + G.view.w / 2, y = h.y - G.cam.y + G.view.h / 2; return { x: x - 46, y: y - 56, w: 92, h: 100 }; },
      enter: function (G, tt) { var h = G.heroes[G.ctrl]; tt.x0 = h ? h.x : 0; tt.y0 = h ? h.y : 0; },
      wait: function (G, tt) { var h = G.heroes[G.ctrl]; return !!h && XY.dist(h.x, h.y, tt.x0, tt.y0) >= 130; } },
    { id: 'orders', title: '其他徒弟：下命令',
      text: function () { return '你同一时间只能亲自操控一位，这叫「手动」。其他徒弟会按「命令」自动行动。\n命令就是每张卡片下面这 4 个小按钮：跟随、驻守、出击、守护。下面我们一个一个试。'; },
      target: function () { return hitsWhere(function (h) { return h.act === 'order'; }); } },
    cmdStep('follow', '命令①：跟随', '「跟随」：他会跟着你操控的人一起走、一起打，适合大家一起转移阵地。\n请点「{N}」卡片上的「跟随」。'),
    cmdStep('station', '命令②：驻守', '「驻守」：他会回到经书营地，只在营地周围打怪，不乱跑——专门看家。\n请点「{N}」卡片上的「驻守」。'),
    cmdStep('attack', '命令③：出击', '「出击」：他会主动去找怪堆、精英和洞府里的 BOSS 打，血太低会自己撤回。想赢就要多出击，光守着不动一定会输！\n请点「{N}」卡片上的「出击」。'),
    cmdStep('guard', '命令④：守护', '「守护」：他守在唐僧身边，替师傅挡妖怪和弹幕。没下过命令的徒弟默认就是守护。\n请点「{N}」卡片上的「守护」，让他回到师傅身边。'),
    { id: 'build', title: '天兵：造一个',
      text: function () { return '金币可以请「护法天兵」——披甲拿兵器的天兵会站在路边帮你打妖怪（弓手、炮手、寒冰兵、破阵弩兵、佛光兵，价格不同）。我们先给你补了点金币。\n请点左下角的一个天兵按钮。'; },
      target: function () { return hitsWhere(function (h) { return h.act === 'tower'; }); },
      enter: function (G, tt) {
        G.coins = Math.max(G.coins, 400);
        var cap = XY.soldierCap ? XY.soldierCap(G) : 99; while (G.towers.length >= cap) G.towers.shift();
      },
      allow: function (h) { return h.act === 'tower'; },
      wait: function (G, tt) { var a = app(); return !!(a && a.build) || G.towers.length > (tt.n0 == null ? 1e9 : tt.n0); } },
    { id: 'place', title: '天兵：放下去',
      text: function () { return (touchUI() ? '再轻点一下西行路（土路）上的空地，天兵就落在那里。' : '再点一下西行路（土路）上的空地，天兵就落在那里（右键 / Esc 取消）。') + '\n天兵会持枪站岗、有妖怪进射程就出手；放在唐僧前面的会原地驻守，唐僧走过之后它就跟上。'; },
      target: function () { return hitsWhere(function (h) { return h.act === 'tower'; }); },
      enter: function (G, tt) { tt.n0 = G.towers.length; },
      allow: function (h) { return h.act === 'tower'; },
      wait: function (G, tt) { return G.towers.length > tt.n0; },
      back: function (G, tt) { var a = app(); return !(a && a.build) && G.towers.length <= tt.n0 && tt.t > 0.6; } },
    { id: 'sky', title: '天兵降临：救急大招',
      text: function () { return '右边这块「天兵降临」每关免费用一次：「点地降临」选个地方落下一队天兵，「就地降临」直接落在你身边。\n留着救急用，现在先别点。'; },
      target: function () { return hitsWhere(function (h) { return h.act === 'sky' || h.act === 'skyFollow'; }); } },
    { id: 'camp', title: '唐僧休息和营地',
      text: function () { return '唐僧走到路上的「休息点」会停下来休息 5 分钟，这时左边的「经书营地」生效：给周围的人回血、减伤。\n但休息时妖怪也越来越多——要守好营地，也别光守着，要派人出击去清理洞府。'; },
      target: function () { return { x: CAMP.x, y: CAMP.y, w: CAMP.w, h: REST.y + REST.h - CAMP.y }; }, pos: midIfNarrow },
    { id: 'lose', title: '怎么输、怎么赢',
      text: function () { return '有两种输法：\n① 唐僧被妖怪碰到或打中（他只有 1 点血）；\n② 经书营地的血被打光。\n想赢：打退洞府 BOSS 完成主线，再让唐僧自己走到最西边的关口。'; },
      target: function () { return { x: CAMP.x, y: CAMP.y, w: CAMP.w, h: TANG.y + TANG.h - CAMP.y }; }, pos: midIfNarrow },
    { id: 'buttons', title: '右上角的按钮',
      text: function () { return touchUI() ? '「暂停」：暂停游戏；造天兵选点的时候，它就是“取消”。\n「技能树」：升级后给徒弟加点，再点一次关闭。' : '「Esc / 暂停」：暂停游戏，造天兵选点时是“取消”。\n「Tab / 技能树」：升级后给徒弟加点，再按一次关闭。右上的按钮也能直接点。'; },
      target: function () { return hitsWhere(function (h) { return h.act === 'skills' || h.act === 'esc'; }); }, pos: midIfNarrow },
    { id: 'done', title: '教程完成！', last: true,
      text: function () { return '你已经学会了：选角色、下命令、请天兵、看营地和输赢。\n祝取经顺利！以后想再看一遍，在主菜单点「新手教程」。'; },
      target: function () { return null; } }
  ];

  /* ---------- 状态 ---------- */
  XY.tutStart = function (G) {
    if (!G) return;
    G.tut = { i: 0, t: 0, entered: -1, ok: 0 };
    G.tutSave = { noSpawn: G.noSpawn, god: G.godMode };
    G.noSpawn = true; G.godMode = true;
  };
  XY.tutFinish = function (G, skipped) {
    if (!G || !G.tut) { if (XY.save.data.tutorial) { XY.save.data.tutorial.done = true; XY.save.touch(); } return; }
    G.tut = null;
    if (G.tutSave) { G.noSpawn = G.tutSave.noSpawn; G.godMode = G.tutSave.god; G.tutSave = null; }
    G.heroes.forEach(function (h, i) { if (i > 0 && h.order !== 'guard') { h.order = 'guard'; h.retreat = false; h.tgt = null; } });
    var a = app(); if (a) { a.build = null; a.summon = null; a.selTower = null; }
    if (XY.save.data.tutorial) { XY.save.data.tutorial.done = true; XY.save.touch(); }
    XY.toast(G, skipped ? '已跳过教程（主菜单可以重看）' : '教程完成，开始取经！');
  };
  XY.tutNext = function (G) {

<script>
/* ---- js/render4.js ---- */
/* ============================================================
 * render4.js —— v0.4 新增的绘制：洞府 / 关口 / 被困者 / 天兵 / 妖塔 / 五种塔（含升级外观）/ 常驻角色头像造型 / 全新 HUD

 * ============================================================ */
(function () {
  var XY = window.XY, C = XY.C, PI2 = Math.PI * 2, R4 = XY.R4 = { rt: 0 };

  /* ================= 常驻角色：头像（圆形）+ 边框 + 程序画的身体 / 光环 ================= */
  // 头像圆盘：有图片画图片，没有就画“首字”占位（颜色取角色色）

  R4.joy = function (c, app) {

    c.restore();
  };

    var ec = ELC(def.elem);
    for (var k = 0; k < 4; k++) {
      var a = k * Math.PI / 2 + Math.PI / 4, gx = x + Math.cos(a) * (r + r * 0.28), gy = y + Math.sin(a) * (r + r * 0.28);
      c.fillStyle = ec; c.strokeStyle = '#fff'; c.lineWidth = 1; c.beginPath(); c.arc(gx, gy, Math.max(1.8, r * 0.13), 0, PI2); c.fill(); c.stroke();
    }
  };
  R4.specialShape = function (c, def, x, y, r) {

    c.beginPath(); c.moveTo(x - r * 0.55, y + r * 0.2); c.lineTo(x + r * 0.55, y + r * 0.2); c.lineTo(x + r * 0.95, y + r * 1.05); c.lineTo(x - r * 0.95, y + r * 1.05); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = def.frame || '#fff'; c.fillRect(x - r * 0.52, y + r * 0.5, r * 1.04, r * 0.14);

    else if (arch === 'heal') { c.beginPath(); c.moveTo(x + r * 1.1, y + r * 0.1); c.quadraticCurveTo(x + r * 1.45, y + r * 0.6, x + r * 1.1, y + r * 0.85); c.quadraticCurveTo(x + r * 0.75, y + r * 0.6, x + r * 1.1, y + r * 0.1); c.fill(); c.stroke(); }

    else if (arch === 'tank') { rrectS(c, x - r * 1.45, y + r * 0.25, r * 0.8, r * 1.0, r * 0.2); c.fill(); c.stroke(); }
    else if (arch === 'storm') { c.beginPath(); c.moveTo(x + r * 1.2, y - r * 0.2); c.lineTo(x + r * 0.95, y + r * 0.45); c.lineTo(x + r * 1.25, y + r * 0.45); c.lineTo(x + r * 1.0, y + r * 1.2); c.stroke(); }

    if (def.awakened && !R4.xfDraw) { c.fillStyle = '#f0b429'; c.strokeStyle = '#a8700a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x - r * 0.6, y - r * 1.5); c.lineTo(x - r * 0.3, y - r * 1.9); c.lineTo(x, y - r * 1.55); c.lineTo(x + r * 0.3, y - r * 1.9); c.lineTo(x + r * 0.6, y - r * 1.5); c.closePath(); c.fill(); c.stroke(); }
  };
  function rrectS(c, x, y, w, h, r) { R().rrect(c, x, y, w, h, r); }

  /* ================= 世界：洞府 / 关口 / 被困者 / 宝物 ================= */
  function drawDen(c, G, den, rt) {
    var x = den.x, y = den.y, ec = ELC(den.elem), alive = den.alive, T = R();
    if (!inV(G, x, y, 140)) return;

    if (alive) { var pg = c.createRadialGradient(x, y, 20, x, y, 130); pg.addColorStop(0, ec + '55'); pg.addColorStop(1, ec + '00'); c.fillStyle = pg; c.beginPath(); c.arc(x, y, 130 + Math.sin(rt * 2) * 6, 0, PI2); c.fill(); }

    c.fillStyle = alive ? '#7a6d62' : '#c9c6bd';

    // 牌匾

<script>
/* ---- js/main.js ---- */
/* ============================================================
 * main.js —— 入口：画布尺寸、键盘/鼠标输入、界面切换、主循环
 * 界面(app.screen)：start 主菜单 / levels 关卡选择 / shop 商店 / deck 组牌 / dex 图鉴 / unlock 解锁·皮肤 / play 游戏中 / pause 暂停 / win 胜利 / lose 失败
 * 技能树打开时是游戏中的一种状态(G.mode === 'skills')，游戏暂停
 * ============================================================ */
(function () {
  var XY = window.XY, C = XY.C;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  if (!ctx) { if (window.XY_fail) window.XY_fail('这个浏览器不能画图（canvas）'); return; }

  var app = XY.app = {
    screen: 'start', levelId: 1, summon: null, moveMark: null, mm: { holding: false, downAt: 0, sx: 0, sy: 0, dest: null }, lw: 1280, lh: 720, zoom: 1, dpr: 1, rt: 0,
    mouse: null, fps: 60,
    // 调试键默认关闭：网址加 ?debug=1 打开，或者游戏里按 Shift+F9 切换
    debugOn: /[?&]debug(=1|=true)?(&|#|$)/.test(location.search),
    skillTab: 1, skillMsg: null, build: null, selTower: null,
    touchUI: !!(window.XY_TOUCH_UI || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0)),      // 触屏设备：显示屏幕上的“暂停 / Esc”按钮
    confirm: null, deckSel: null, dexTab: 'enemy', dexSel: null, menuMsg: null
  };
  app.showFps = app.debugOn;
  var G = null, keys = {}, acc = 0, last = performance.now();
  var SPEEDS = [1, 2, 4, 8];

  /* ---------- 画布尺寸：窗口多大就画多大，整体按比例缩放 ---------- */
  function resize() {
    var w = window.innerWidth, h = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
    app.dpr = dpr;
    app.zoom = Math.max(0.5, Math.min(1.4, Math.min(w / 1280, h / 720)));      // 下限 0.5：手机横屏（如 844×390）整个界面（含底部按钮）都在屏幕里；原来 0.8 会把底部挤出屏幕
    app.lw = w / app.zoom; app.lh = h / app.zoom;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    if (G) { G.view.w = app.lw; G.view.h = app.lh; }
    if (XY.portraitHint) XY.portraitHint();
  }
  window.addEventListener('resize', resize);
  // 手机转屏：iOS 常常在转完后一会儿才报新的宽高，所以再补两次；地址栏伸缩（visualViewport）也跟着量
  function resizeLater() { resize(); setTimeout(resize, 150); setTimeout(resize, 600); }
  window.addEventListener('orientationchange', resizeLater);
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  // 竖屏提示：只是提示，不拦着（点“知道了”或转成横屏就消失）；屏幕是触屏且竖着时才出
  var portraitDismissed = false;
  function portraitHint() {
    var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    var portrait = window.innerHeight > window.innerWidth * 1.1;
    var el = document.getElementById('xyPortrait');
    if (touch && portrait && !portraitDismissed) {
      if (!el && window.XY_bar) { el = window.XY_bar('xyPortrait', '📱 请把手机横过来玩（画面更大）。现在竖着也能进游戏。', '#fff4c2'); el.querySelector('button').addEventListener('click', function () { portraitDismissed = true; }); }
    } else if (el && el.parentNode) el.parentNode.removeChild(el);
  }
  XY.portraitHint = portraitHint;

  /* ---------- 开始 / 重开 ---------- */
  function fresh() {
    G = XY.newGame(app.levelId); app.build = null; app.selTower = null; app.summon = null; app.moveMark = null; app.mm.holding = false; app.mm.dest = null;
    G.view.w = app.lw; G.view.h = app.lh;
    var h = G.heroes[G.ctrl]; G.cam.x = h.x; G.cam.y = h.y;
    XY.G = G;
  }
  // 中途放弃（回首页 / 重开）也记一局：时间和击杀照算

    if (!XY.save.levelUnlocked(app.levelId)) app.levelId = 1;
    fresh(); app.screen = 'play'; acc = 0; app.confirm = null;
  }
  function goHome() { abandon(); fresh(); app.screen = 'start'; }
  function toMenu() { fresh(); app.screen = 'start'; app.confirm = null; }     // 从子界面回主菜单（刷新预览里的皮肤）
  function msg(text, bad) { app.menuMsg = { text: text, bad: !!bad, until: app.rt + 3 }; }

  function pause() { if (app.screen === 'play' && G.mode === 'play') app.screen = 'pause'; }
  function resume() { if (app.screen === 'pause') { app.screen = 'play'; last = performance.now(); } }

  /* ---------- 键盘 ---------- */
  function updateMove() {
    var mx = 0, my = 0, mm = app.mm;
    if (keys.KeyA || keys.ArrowLeft) mx -= 1;

    if (keys.KeyW || keys.ArrowUp) my -= 1;
    if (keys.KeyS || keys.ArrowDown) my += 1;
    if (!mx && !my && app.joy && app.joy.moved && (app.joy.ux || app.joy.uy)) { mx = app.joy.ux; my = app.joy.uy; }   // 触屏摇杆（键盘优先）

    last = performance.now();
  }
  XY.introSkip = function () { introEnd('skip'); };
  function introStart() {
    if (window.XY_NO_INTRO || /[?&]intro=0/.test(location.search)) return;
    var v, skip;
    try {
      v = document.createElement('video');
      v.id = 'introVideo'; v.playsInline = true; v.preload = 'auto'; v.controls = false; v.muted = false;
      v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
      // 视频一开始是看不见、点不到的（不挡住下面的主菜单）：真的开始播了才盖上来，所以没有视频 / 播不出来时玩家什么都不会看到
      v.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;object-fit:contain;background:#fff7e0;z-index:50;cursor:pointer;opacity:0;pointer-events:none;';
      skip = document.createElement('button');
      skip.id = 'introSkip'; skip.textContent = '跳过 ▸'; skip.style.cssText = 'position:fixed;right:18px;top:16px;z-index:52;font:700 20px sans-serif;padding:10px 20px;min-width:96px;min-height:46px;border-radius:14px;border:3px solid #b9a77a;background:#fff8e0;color:#4a3a1a;cursor:pointer;display:none;';
      introEl = v; app.intro = { t0: performance.now() };
      v.addEventListener('error', function () { introEnd('error'); });
      v.addEventListener('abort', function () { if (app.intro && !app.intro.playing) introEnd('abort'); });
      v.addEventListener('stalled', function () { if (app.intro && !app.intro.playing) { clearTimeout(introTimer); introTimer = setTimeout(function () { introEnd('stalled'); }, 1500); } });
      v.addEventListener('ended', function () { introEnd('ended'); });
      v.addEventListener('playing', function () {
        clearTimeout(introTimer); if (app.intro) app.intro.playing = true;
        v.style.opacity = '1'; v.style.pointerEvents = 'auto'; skip.style.display = '';
        introTimer = setTimeout(function () { introEnd('toolong'); }, 60000);          // 万一播着播着卡住（不触发 ended）：一分钟后放行
      });
      v.addEventListener('waiting', function () { if (app.intro && app.intro.playing) { clearTimeout(introTimer); introTimer = setTimeout(function () { introEnd('buffer'); }, 8000); } });
      v.addEventListener('click', function () { introEnd('skip'); });
      v.addEventListener('touchend', function (e) { e.preventDefault(); introEnd('skip'); }, { passive: false });
      skip.addEventListener('click', function () { introEnd('skip'); });
      document.body.appendChild(v); document.body.appendChild(skip);
      introTimer = setTimeout(function () { if (app.intro && !app.intro.playing) introEnd('timeout'); }, 3000);   // 3 秒还没开始播 = 放弃
      v.src = window.XY_INTRO_SRC || 'assets/intro.mp4';
      var pr = v.play();
      if (pr && pr.catch) pr.catch(function () {                         // 浏览器不让带声音自动播放：静音先播，右上角给个「开声音」
        if (!introEl) return; v.muted = true;
        var p2; try { p2 = v.play(); } catch (e) { introEnd('blocked'); return; }
        if (p2 && p2.catch) p2.catch(function () { introEnd('blocked'); });
        var mb = document.createElement('button'); mb.id = 'introMute'; mb.textContent = '🔊 开声音'; mb.style.cssText = 'position:fixed;right:18px;top:76px;z-index:52;font:700 18px sans-serif;padding:8px 16px;min-height:42px;border-radius:14px;border:3px solid #b9a77a;background:#fff8e0;color:#4a3a1a;cursor:pointer;';
        mb.addEventListener('click', function () { v.muted = false; if (mb.parentNode) mb.parentNode.removeChild(mb); });
        document.body.appendChild(mb);
      });
    } catch (e) { introEnd('exception'); }     // 视频相关的任何异常都不能影响进游戏
  }

  resize();
  fresh();
  try { introStart(); } catch (e) { introEnd('exception'); }
  window.__xy = { app: app, get G() { return G; }, startGame: startGame, keys: keys, fresh: fresh };
  requestAnimationFrame(frame);
})();
